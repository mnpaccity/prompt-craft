<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt CRAFT — The Prompting Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2330; --muted:#5d6475; --line:#e4e0d6;
    --C:#2f7de1; --R:#8e4fd6; --A:#e0542f; --F:#1f9e6b; --T:#e0a21f; --E:#d43f86;
    --good:#1f9e6b; --bad:#d6453a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181f; --card:#1f222b; --ink:#eef0f5; --muted:#a3a9b8; --line:#30343f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .logo{font-family:Fredoka,sans-serif;font-size:44px;font-weight:700;cursor:pointer;line-height:1.1;letter-spacing:.5px}
  @media (max-width:520px){ .logo{font-size:34px} }
  .logo span{display:inline-block}
  .score{font-family:Fredoka;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
  h1,h2,h3{font-family:Fredoka,sans-serif;margin:0 0 10px}
  h1{font-size:34px} h2{font-size:24px} h3{font-size:19px}
  p{margin:0 0 10px}
  .muted{color:var(--muted)}
  .letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}
  .letters .lt{flex:1 1 150px;max-width:190px}
  .lt{border-radius:14px;padding:12px;color:#fff}
  .lt b{font-family:Fredoka;font-size:30px;line-height:1;display:block}
  .lt .w{font-family:Fredoka;font-size:18px;font-weight:600}
  .lt small{display:block;opacity:.95;font-size:13px;margin-top:4px}
  .games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .gbtn{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .1s,border-color .1s}
  .gbtn:hover{transform:translateY(-2px);border-color:var(--C)}
  .gbtn .n{font-family:Fredoka;font-size:20px;font-weight:600;display:block}
  .gbtn .em{font-size:28px}
  .best{font-size:13px;color:var(--muted);margin-top:6px}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:16px}
  .opt:hover:not(:disabled){border-color:var(--C)}
  .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--card))}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
  .opt:disabled{cursor:default}
  .row5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .lbtn{font-family:Fredoka;font-size:22px;font-weight:700;color:#fff;border:none;border-radius:12px;padding:14px 4px;cursor:pointer;line-height:1.1}
  .lbtn small{display:block;font-family:Inter;font-size:11px;font-weight:600;opacity:.95}
  .lbtn:disabled{opacity:.35;cursor:default}
  .lbtn.pick{outline:4px solid var(--ink);opacity:1}
  .phrase{font-size:21px;font-family:Fredoka;font-weight:500;background:var(--bg);border-radius:12px;padding:16px;border-left:6px solid var(--muted)}
  .fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}
  .fb.good{background:color-mix(in srgb,var(--good) 15%,var(--card));border:2px solid var(--good)}
  .fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:2px solid var(--bad)}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--C),var(--R),var(--A),var(--F),var(--T));transition:width .3s}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{font:inherit;font-family:Fredoka;font-weight:600;font-size:17px;padding:11px 20px;border-radius:12px;border:none;background:var(--ink);color:var(--bg);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
  .btn:disabled{opacity:.4;cursor:default}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}
  .tile{width:46px;height:52px;border-radius:10px;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:26px;font-weight:700;cursor:pointer;user-select:none}
  .tile.used{opacity:.25;cursor:default}
  .answer{display:flex;gap:8px;justify-content:center;min-height:56px;flex-wrap:wrap}
  .slot{width:46px;height:52px;border-radius:10px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:26px;font-weight:700}
  .slot.f{border-style:solid;border-color:var(--C);cursor:pointer}
  .bgroup{margin-top:16px}
  .bgroup .lab{font-family:Fredoka;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .chip{display:inline-flex;width:28px;height:28px;border-radius:8px;color:#fff;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700}
  .built{background:var(--bg);border-radius:12px;padding:14px;font-size:15px;white-space:pre-wrap;border:2px solid var(--line)}
  .rev{display:grid;gap:8px;margin-top:12px}
  .rev div{padding:10px 12px;border-radius:10px;font-size:14px;border:2px solid var(--line)}
  .rev .s{border-color:var(--good)} .rev .v{border-color:var(--T)} .rev .o{border-color:var(--bad)}
  .badge{display:inline-block;font-family:Fredoka;font-size:15px;padding:4px 12px;border-radius:99px;background:var(--bg);border:2px solid var(--line);margin:4px 4px 0 0}
  .big{font-family:Fredoka;font-size:56px;font-weight:700;line-height:1}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
  .tab{font:inherit;font-family:Fredoka;font-weight:600;font-size:16px;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav .tab{font-size:15px;padding:7px 14px}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
  .ph{background:color-mix(in srgb,var(--T) 30%,transparent);border-radius:5px;padding:0 3px;font-weight:600}
  .pcard{padding:16px 18px;margin-bottom:10px}
  .pcard .head{display:flex;align-items:center;gap:12px;cursor:pointer}
  .pcard .body{display:none;margin-top:14px}
  .pcard.open .body{display:block}
  .pcard .arrow{transition:transform .2s;font-size:18px}
  .pcard.open .arrow{transform:rotate(180deg)}
  .dots{display:flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
  .pl{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .pl .chip{flex-shrink:0}
  .pl > div{white-space:pre-wrap}
  .libbtn{width:100%;margin-top:14px;text-align:left;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--C) 18%,var(--card)),color-mix(in srgb,var(--F) 18%,var(--card)))}
  @media (max-width:520px){ .dots{display:none} }
  .qcopy{font:inherit;font-family:Fredoka;font-weight:600;font-size:14px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
  .qcopy:hover{border-color:var(--C)}
  .qcopy.done,.copy.done{border-color:var(--good)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  .drop{display:block;text-align:center;border:3px dashed var(--line);border-radius:16px;padding:28px 16px;cursor:pointer;background:var(--bg);transition:border-color .15s}
  .drop:hover,.drop.over{border-color:var(--C)}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .th{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px}
  .th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
  .th .num{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);font-family:Fredoka;font-weight:700;border-radius:8px;padding:0 8px}
  .th select,.fld select,.fld input{width:100%;font:inherit;font-size:14px;padding:7px 8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
  .thb{display:flex;gap:4px;margin-top:6px}.thb button{flex:1;font:inherit;padding:4px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .fld span{font-size:13px;font-weight:600;color:var(--muted)}
  .clip{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .clip img{width:110px;height:82px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .ptext{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0;border:2px solid var(--line);max-height:220px;overflow:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  .presetbox{margin-top:14px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
  .presetbox summary{cursor:pointer;font-family:Fredoka;font-weight:600;font-size:16px}
  .presetbox textarea{width:100%;font:inherit;font-size:14px;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:4px;resize:vertical}
  .warnnote{font-size:13px;background:color-mix(in srgb,var(--T) 18%,var(--card));border:2px solid var(--T);border-radius:10px;padding:8px 10px}
  .additem{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .mini{width:80px;font:inherit;font-size:14px;padding:5px 6px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
  .xbtn{font:inherit;font-size:13px;padding:4px 9px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .totals{margin-top:12px;border-top:2px solid var(--line)}
  .totals>div{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
  .totals .grand{font-family:Fredoka;font-size:22px;border-bottom:none}
  .totals .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
  .bigresult{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:var(--bg);border-radius:14px;padding:16px;margin-top:16px}
  .bigresult b{font-family:Fredoka;font-size:34px}
  .stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:12px;background:var(--line)}
  .stack i{display:block;height:100%}
  .stat{background:var(--bg);border-radius:12px;padding:12px}.stat span{display:block;font-size:13px;color:var(--muted)}.stat b{font-family:Fredoka;font-size:20px}
  .plangrid{display:grid;grid-template-columns:1fr;gap:0}
  @media (min-width:900px){ .plangrid{grid-template-columns:1.1fr 1fr;gap:16px} .wrap{max-width:1100px} }
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
  .dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
  .day{font:inherit;aspect-ratio:1/1;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;gap:2px;position:relative;min-height:44px}
  .day.out{opacity:.4}.day.today{border-color:var(--A)}.day.today .dn{color:var(--A);font-weight:700}
  .day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .day .dn{font-family:Fredoka;font-size:15px}
  .day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.day .dots i{width:6px;height:6px;border-radius:50%;display:block}
  .day .tk{font-size:10px;font-weight:700;opacity:.8}
  .ev{display:flex;gap:10px;border:2px solid var(--line);border-left:6px solid;border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
  .evactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .glink{font-size:13px;font-weight:600;color:var(--C);text-decoration:none;border:2px solid var(--C);border-radius:8px;padding:3px 9px}
  .task{display:flex;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--bg);cursor:pointer}
  .task input{width:18px;height:18px}.task.done span{text-decoration:line-through;opacity:.55}
  .weekday{border-top:1px solid var(--line);padding:12px 0}
  .helpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-6px 0 16px}
  .lvl{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .lvl button{font:inherit;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer}
  .lvl button.on{background:var(--F);color:#fff}
  .helpcard{max-width:720px;width:100%;max-height:88vh;overflow:auto}
  .helpsteps{padding-left:22px;margin:14px 0 0}.helpsteps li{margin-bottom:12px;line-height:1.55}
  .qhelp{border-color:color-mix(in srgb,var(--F) 50%,var(--line))}
  @media (max-width:520px){ .qhelp{font-size:0;padding:6px 9px} .qhelp::before{content:'❓';font-size:14px} }
  .calcwrap{max-width:420px;margin-left:auto;margin-right:auto}
  .calcscreen{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;text-align:right;margin-top:8px}
  .cexpr{font-size:15px;opacity:.7;min-height:22px;word-break:break-all}
  .cout{font-family:Fredoka;font-size:40px;font-weight:600;word-break:break-all}
  .calckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .ck{font:inherit;font-family:Fredoka;font-size:24px;font-weight:600;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
  .ck:active{transform:scale(.96)}
  .ck.op{background:color-mix(in srgb,var(--C) 15%,var(--card));color:var(--C)}
  .ck.clr{background:color-mix(in srgb,var(--A) 15%,var(--card));color:var(--A)}
  .ck.eq{background:var(--F);color:#fff;border-color:var(--F)}
  .hrow{padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .gtag{font-size:12px;font-weight:600;color:#4285F4;background:color-mix(in srgb,#4285F4 12%,var(--card));border-radius:8px;padding:3px 8px}
  .gbtn{background:var(--card);cursor:pointer;font:inherit;font-size:13px;font-weight:600}
  .ccbtn{background:color-mix(in srgb,var(--R) 12%,var(--card));border-color:color-mix(in srgb,var(--R) 45%,var(--line))}
.cccard{max-width:860px;width:100%;max-height:90vh;overflow:auto}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ccitem{font:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;padding:9px 11px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:13.5px;line-height:1.4}
.ccitem:hover{border-color:var(--R)}.ccitem.done{border-color:var(--F);background:color-mix(in srgb,var(--F) 10%,var(--card))}
.ccitem code{font-family:Consolas,Menlo,monospace;font-size:13.5px;font-weight:700;color:var(--R);word-break:break-all}
.ccdetail{margin-top:10px}.cchead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.ccbig{font-family:Consolas,Menlo,monospace;font-size:22px;font-weight:800;color:var(--R);word-break:break-all}
.ccsec{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.ccsec h4{margin:0 0 4px;font-family:Fredoka;font-size:16px}.ccsec p{margin:0;line-height:1.55}.ccsec .steps{margin:2px 0 0}
.docchip{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.dlbox{border:2px solid color-mix(in srgb,var(--A) 45%,var(--line));background:color-mix(in srgb,var(--A) 6%,var(--card))}
.realbox{margin-top:12px;padding:12px;border-radius:14px;background:rgba(46,160,67,.08);border:1.5px solid rgba(46,160,67,.35);text-align:left}
#clipVid{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:18px}
.askrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;background:color-mix(in srgb,var(--bad) 10%,var(--card));border-radius:8px;padding:6px 8px}
  .xbtn.danger{border-color:var(--bad);color:var(--bad)}
  .hdr{display:block;margin-bottom:16px}
  .hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .helpcorner{font:inherit;font-family:Fredoka;font-weight:600;font-size:16px;padding:8px 16px;border-radius:999px;border:none;background:var(--C);color:#fff;cursor:pointer;box-shadow:0 3px 10px color-mix(in srgb,var(--C) 35%,transparent)}
  .helpcorner:hover{filter:brightness(1.08)}
  .hdr .helpbar{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;padding:8px 12px 8px 14px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--F) 22%,var(--card)),color-mix(in srgb,var(--T) 22%,var(--card)));border:2px dashed color-mix(in srgb,var(--F) 55%,var(--line))}
  .hb-label{font-family:Fredoka;font-weight:600;font-size:15px}
  .hdr .lvl{border-radius:10px;border-color:color-mix(in srgb,var(--F) 40%,var(--line))}
  .hdr .lvl button{font-size:14px;padding:7px 12px}
  .hdr-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stackx{max-width:680px;margin:0 auto}
  .srow{display:flex;align-items:stretch;gap:12px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:14px;padding:10px}
  .sbadge{flex:0 0 86px;background:var(--c);color:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px}
  .sbadge b{font-family:Fredoka;font-size:30px;line-height:1}.sbadge span{font-family:Fredoka;font-size:14px;font-weight:600}
  .sline{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
  .sq{font-size:17px;font-weight:500}.sline small{color:var(--muted);font-size:13px}
  .splus{text-align:center;font-family:Fredoka;font-weight:700;color:var(--muted);font-size:18px;line-height:1;margin:4px 0}
  .sarrow{text-align:center;font-family:Fredoka;font-weight:600;color:var(--muted);margin:14px 0 10px;letter-spacing:1px}
  .finalp{max-width:680px;margin:0 auto;background:var(--bg);border:3px solid var(--ink);border-radius:16px;padding:16px 18px;box-shadow:6px 6px 0 color-mix(in srgb,var(--ink) 18%,transparent)}

function scrambleGame(){
  const qs = LEVEL==='new' ? shuffle(WORDS.filter(w=>w[0].length<=7)).slice(0,5) : LEVEL==='some' ? shuffle(WORDS).slice(0,6) : shuffle(ADV_WORDS).slice(0,6);
  let i=0, got=0;
  function show(){
    if(i>=qs.length) return results('scramble',got,qs.length*15,'Prompting has its own vocabulary. Being SPECIFIC about your AUDIENCE and giving an EXAMPLE are the fastest ways to improve any prompt. And if it is not right the first time — ITERATE!');
    const [word,hint]=qs[i];
    let letters; do{ letters=shuffle(word.split('')); }while(letters.join('')===word && word.length>1);
    const tiles = letters.map((c,k)=>({c,k,used:false}));
    let picked=[], hinted=false, done=false, freeHint=LEVEL==='new';
    if(freeHint){ const t0=tiles.find(t=>t.c===word[0]); t0.used=true; picked.push(t0.k); hinted=true; }
    function draw(){
      $('#app').innerHTML = `<div class="card pop">
        <div class="top"><h3>🧩 Word Scramble</h3><span class="muted">${i+1} of ${qs.length}</span></div>${bar(i,qs.length)}
        <p><b>Clue:</b> ${hint}</p>
        <p class="muted" style="font-size:14px">Tap the letters in the right order. Tap a placed letter to remove it.</p>
        <div class="answer">${word.split('').map((_,k)=>picked[k]!==undefined?`<div class="slot f" data-s="${k}">${tiles[picked[k]].c}</div>`:`<div class="slot"></div>`).join('')}</div>
        <div class="tiles">${tiles.map(t=>`<div class="tile ${t.used?'used':''}" data-t="${t.k}">${t.c}</div>`).join('')}</div>
        <div class="actions" style="justify-content:center">
          ${freeHint?'<span class="muted" style="font-size:13px;align-self:center">🌱 First letter given for free</span>':`<button class="btn ghost" id="hint" ${hinted||done?'disabled':''}>💡 Hint (first letter)</button>`}
          <button class="btn ghost" id="skip" ${done?'disabled':''}>Give up</button>
        </div>
        <div id="fb"></div></div>`;
      if(done) return;
      document.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{const t=tiles[+el.dataset.t]; if(t.used) return; t.used=true; picked.push(t.k); check();});
      document.querySelectorAll('.slot.f').forEach(el=>el.onclick=()=>{const s=+el.dataset.s; if(hinted && s===0) return; const k=picked.splice(s,1)[0]; tiles[k].used=false; draw();});
      if($('#hint')) $('#hint').onclick=()=>{ hinted=true; picked.forEach(k=>tiles[k].used=false); picked=[]; const t=tiles.find(t=>t.c===word[0]); t.used=true; picked.push(t.k); draw(); };
      $('#skip').onclick=()=>finish(false);
    }
    function check(){
      if(picked.length<word.length) return draw();
      const guess=picked.map(k=>tiles[k].c).join('');
      if(guess===word) finish(true); else { draw(); $('#fb').innerHTML=`<div class="fb bad pop">Not quite — tap letters in the top row to take them back out.</div>`; }
    }
    function finish(ok){
      done=true; const pts= ok?((hinted&&!freeHint)?5:15):0; got+=pts; if(pts) addPoints(pts);
      picked = word.split('').map((c,k)=>k); tiles.forEach((t,k)=>{t.c=word[k];t.used=true;});
      draw();
      $('#fb').innerHTML = `<div class="fb ${ok?'good':'bad'} pop"><b>${ok?`✅ ${word}! +${pts}`:`The word was ${word}.`}</b><br>${hint}</div><div class="actions"><button class="btn">Next →</button></div>`;
      $('#fb .btn').onclick=()=>{i++;show();};
    }
    draw();
  }
  show();
}

function buildGame(){
  const list = shuffle(SCENARIOS);
  let si=0, got=0;
  function show(){
    if(si>=list.length) return results('build',got,list.length*50,'A strong piece is SPECIFIC and does its own job. Vague words like "nice" or "good" do not tell the AI anything. And a sentence in the wrong spot (like a tone word where the task should be) leaves that letter empty.');
    const sc=list[si]; const choice={};
    const adv=LEVEL==='adv'?BUILD_ADV[SCENARIOS.indexOf(sc)]:null;
    const opts={}; CRAFT.forEach((x,k)=>opts[x.L]=shuffle(adv?[...sc[x.L],[adv[k],'d']]:sc[x.L]));
    $('#app').innerHTML = `<div class="card pop">
      <div class="top"><h3>🛠️ Prompt Builder</h3><span class="muted">Challenge ${si+1} of ${list.length}</span></div>${bar(si,list.length)}
      <p style="font-size:18px"><b>Your task:</b> ${sc.task}</p>
      <p class="muted">For each letter, pick the sentence that does that job the BEST. Watch out — some are vague, and some belong to a different letter!</p>
      ${LEVEL==='adv'?'<p class="lvlnote lv-adv" style="margin-top:0">🌳 <b>Expert round:</b> each letter now has an “almost right” option too. Only the most specific one earns full points.</p>':''}
      ${CRAFT.map(x=>`<div class="bgroup"><div class="lab"><span class="chip" style="background:${COLOR[x.L]}">${x.L}</span>${x.w}${LEVEL==='new'?`<span class="muted" style="font-size:13px;font-family:Inter;font-weight:400;margin-left:6px">— 💡 ${BUILD_HINT[x.L]}</span>`:''}</div>
        <div class="opts" style="margin-top:0">${opts[x.L].map((o,k)=>`<button class="opt" data-l="${x.L}" data-k="${k}">${o[0]}</button>`).join('')}</div></div>`).join('')}
      <div class="actions"><button class="btn" id="go" disabled>Build my prompt →</button></div>
      <div id="out"></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const L=b.dataset.l; choice[L]=+b.dataset.k;
      document.querySelectorAll(`.opt[data-l="${L}"]`).forEach(x=>x.style.borderColor=''); b.style.borderColor=COLOR[L];
      $('#go').disabled = Object.keys(choice).length<5;
    });
    $('#go').onclick=()=>{
      document.querySelectorAll('.opt').forEach(x=>x.disabled=true); $('#go').remove();
      let pts=0; const rev=[];
      CRAFT.forEach(x=>{
        const [txt,kind]=opts[x.L][choice[x.L]];
        const best=opts[x.L].find(o=>o[1]==='s')[0];
        if(kind==='s'){pts+=10; rev.push(`<div class="s">✅ <b>${x.w}:</b> Strong and specific. +10</div>`);}
        else if(kind==='d'){pts+=6; rev.push(`<div class="v">👍 <b>${x.w}:</b> “${txt}” is decent, but missing specifics. +6<br><span class="muted">Better: “${best}”</span></div>`);}
        else if(kind==='v'){pts+=3; rev.push(`<div class="v">⚠️ <b>${x.w}:</b> "${txt}" is too vague. +3<br><span class="muted">Better: "${best}"</span></div>`);}
        else { rev.push(`<div class="o">❌ <b>${x.w}:</b> "${txt}" belongs to a different letter, so ${x.w} was left empty. +0<br><span class="muted">Better: "${best}"</span></div>`);}
      });
      got+=pts; addPoints(pts);
      const prompt = CRAFT.map(x=>opts[x.L][choice[x.L]][0]).join(' ');
      $('#out').innerHTML = `<div class="pop" style="margin-top:18px">
        <h3>Your finished prompt — ${pts}/50</h3>
        <div class="built">${esc(prompt)}</div>
        <button class="btn ghost" id="copy" style="margin-top:10px">📋 Copy prompt</button>
        <div class="rev">${rev.join('')}</div>
        <div class="actions"><button class="btn" id="nx">${si+1<list.length?'Next challenge →':'See results →'}</button></div></div>`;
      $('#copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(prompt); $('#copy').textContent='✅ Copied!'; }catch(e){ $('#copy').textContent='Select the text above to copy'; } };
      $('#nx').onclick=()=>{si++;show();window.scrollTo(0,0);};
      $('#out').scrollIntoView({behavior:'smooth'});
    };
  }
  show();
}

function recallGame(){
  const L=CRAFT;
  $('#app').innerHTML = `<div class="card pop">
    <h3>🧠 Memory Test</h3>
    <p>${LEVEL==='new'?'Type the word each letter stands for. The gray hint shows the first letter and how many letters. (Capitals don’t matter.)':LEVEL==='adv'?'🌳 Expert mode: no letters shown. Type all 5 CRAFT words <b>in order</b>, from memory. (Capitals don’t matter.)':'No hints this time. Type the word each letter stands for. (Spelling counts, but capitals don’t.)'}</p>
    <div style="display:grid;gap:10px;margin-top:12px">
      ${L.map((x,k)=>`<label style="display:flex;align-items:center;gap:10px"><span class="chip" style="background:${LEVEL==='adv'?'var(--ink)':COLOR[x.L]};width:40px;height:40px;font-size:22px">${LEVEL==='adv'?k+1:x.L}</span>
        <input data-l="${x.L}" autocomplete="off" placeholder="${LEVEL==='new'?x.w[0]+' _ '.repeat(x.w.length-1).trim()+` (${x.w.length} letters)`:LEVEL==='adv'?'Word #'+(k+1)+' of CRAFT…':'Type the word…'}" style="flex:1;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)"></label>`).join('')}
    </div>
    <p style="margin-top:16px"><b>Bonus:</b> Put the 5 letters in the right order (type them, e.g. ABCDE)${LEVEL==='new'?' — 💡 it spells a word that means “to make something with skill”':''}:</p>
    <input id="order" maxlength="5" autocomplete="off" style="font:inherit;font-family:Fredoka;font-size:24px;letter-spacing:6px;text-transform:uppercase;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:180px">
    <div class="actions"><button class="btn" id="chk">Check my answers</button></div>
    <div id="fb"></div></div>`;
  $('#chk').onclick=()=>{
    let got=0; const lines=[];
    document.querySelectorAll('input[data-l]').forEach(inp=>{
      const w=WORD[inp.dataset.l]; const v=inp.value.trim().toLowerCase();
      const ok = v===w.toLowerCase();
      inp.disabled=true; inp.style.borderColor= ok?'var(--good)':'var(--bad)';
      if(ok) got+=10; else lines.push(`<b>${inp.dataset.l}</b> = ${w}`);
    });
    const o=$('#order'); o.disabled=true; const ook=o.value.trim().toUpperCase()==='CRAFT'; o.style.borderColor=ook?'var(--good)':'var(--bad)'; if(ook) got+=10; else lines.push('The order spells <b>CRAFT</b>');
    addPoints(got); $('#chk').remove();
    $('#fb').innerHTML = `<div class="fb ${lines.length?'bad':'good'} pop">${lines.length?'<b>Review these:</b><br>'+lines.join('<br>'):'<b>🏆 Perfect! You have CRAFT memorized.</b>'}</div><div class="actions"><button class="btn">See results →</button></div>`;
    $('#fb .btn').onclick=()=>results('recall',got,60,'Before you send any prompt, run down the letters: Context? Role? Action? Format? Tone? If one is missing, add a sentence for it.');
  };
}

  ['R','Act as a patient spreadsheet teacher.'],
  ['A','Give me the exact formula to use and explain how it works.'],
  ['F','1) The formula in a box I can copy. 2) Exactly which cell to click and paste it in. 3) A plain-English explanation of each part. 4) One common mistake to avoid.'],
  ['T','Beginner-friendly. No jargon.']]},
]},
solve: {name:'🧠 Problem Solvers', d:'Ready-made prompts that create solutions, plans and tools for almost anything.', items:[
 {t:'⭐ Fix my prompt (CRAFT checker)', i:'🛠️', p:[
  ['C','Here is a prompt I wrote: [PASTE YOUR PROMPT]. I am learning the CRAFT method: Context, Role, Action, Format, Tone.'],
  ['R','Act as an expert prompt-writing coach.'],
  ['A','Check my prompt against each CRAFT letter. Tell me what is missing or vague, then rewrite it into a stronger prompt. Ask me up to 3 questions if you need information only I know.'],
  ['F','A checklist table: Letter | Present? (✅/⚠️/❌) | Tip. Then "Improved prompt" in a box I can copy.'],
  ['T','Encouraging teacher. Short and clear.']]},
 {t:'Step-by-step computer fix', i:'💻', p:[
  ['C','I use a [WINDOWS / MAC] computer. Problem: [DESCRIBE WHAT HAPPENS, any error message word for word]. It started [WHEN]. I already tried [WHAT YOU TRIED]. I have no technical training.'],
  ['R','Act as a patient tech-support expert who helps complete beginners.'],
  ['A','Walk me through fixing this, starting with the easiest and safest fixes first. Wait for me to say if each step worked before moving on.'],
  ['F','Numbered steps. Each step tells me exactly what to click or type and what I should see after. Give only 3 steps at a time.'],
  ['T','Calm, simple, no jargon. If you must use a technical word, explain it.']]},
 {t:'Turn any problem into an action plan', i:'🗺️', p:[
  ['C','My problem/goal: [DESCRIBE IT]. Why it matters: [WHY]. What I have to work with: [TIME, MONEY, PEOPLE, TOOLS]. My deadline: [DATE]. What has not worked: [PAST TRIES].'],
  ['R','Act as a strategic planner and problem-solving coach.'],
  ['A','Break this into a clear action plan. First list the 2–3 most likely root causes, then give me steps to solve it.'],
  ['F','Sections: Root Causes, Action Plan (table: Step | What to do | By when | How I know it worked), First thing to do TODAY (one sentence).'],
  ['T','Direct, practical, motivating.']]},
 {t:'Make a checklist for any repeated task', i:'✅', p:[
  ['C','A task I do often: [TASK, e.g. onboarding a new client, closing the store, packing for work trips]. Here is how I do it now: [ROUGH STEPS]. Mistakes that sometimes happen: [MISTAKES].'],
  ['R','Act as an operations expert who writes clear step-by-step procedures.'],
  ['A','Turn this into a checklist anyone could follow, adding any steps I forgot and safeguards to prevent the mistakes.'],
  ['F','A title, "What you need before starting" list, then numbered steps with checkboxes (☐). Mark the most important steps with ⚠️. Fits on one printed page.'],
  ['T','Clear and simple.']]},
 {t:'Help me make a decision', i:'⚖️', p:[
  ['C','I am deciding between: [OPTION A], [OPTION B], [OPTION C]. What matters most to me: [PRIORITIES, e.g. cost, time, quality, stress]. Facts I know about each: [DETAILS].'],
  ['R','Act as a fair, logical decision advisor.'],
  ['A','Compare the options against my priorities, point out any risks I might be missing, and tell me which option fits best and why. Ask me if anything important is unclear.'],
  ['F','A comparison table (Options × Priorities, scored 1–5), then Pros/Cons for each, then a 3-sentence recommendation.'],
  ['T','Honest and balanced — tell me the downsides too.']]},
 {t:'Design a tracker or spreadsheet', i:'📋', p:[
  ['C','I want to keep track of [WHAT: clients, expenses, workouts, inventory, job applications]. I will update it [HOW OFTEN]. I want to be able to quickly see [WHAT YOU WANT TO KNOW AT A GLANCE].'],
  ['R','Act as a spreadsheet designer who builds simple tools for beginners.'],
  ['A','Design the tracker for me: which columns to use, example rows, and any simple formulas for totals or alerts.'],
  ['F','1) A table showing the column headers with 3 example rows filled in. 2) A list of formulas with where to put each. 3) Two tips to keep it tidy.'],
  ['T','Beginner-friendly.']]},
 {t:'Learn a new skill in 30 days', i:'🎓', p:[
  ['C','I want to learn [SKILL]. My current level: [BEGINNER / SOME EXPERIENCE]. I have [MINUTES] per day. I learn best by [WATCHING / READING / DOING]. My goal by day 30: [GOAL].'],
  ['R','Act as an expert teacher in this skill who designs beginner courses.'],
  ['A','Create a 30-day learning plan with small daily tasks that build on each other, plus weekly mini-tests so I can check my progress.'],
  ['F','Week-by-week sections. Each day: one task, time needed, and what I will be able to do after. Free resources only.'],
  ['T','Encouraging and realistic.']]},
 {t:'Brainstorm ideas, then pick the best', i:'💡', p:[
  ['C','I need ideas for [WHAT: a gift, a marketing campaign, a team activity, a side business]. Limits: [BUDGET, TIME, RULES]. It is for [WHO].'],
  ['R','Act as a creative strategist.'],
  ['A','Brainstorm 15 ideas, from safe to bold. Then pick your top 3 and explain why they are the best fit for my limits.'],
  ['F','Numbered list of 15 (one line each). Then "Top 3" with 2 sentences each and the first step to get started.'],
  ['T','Creative and energetic.']]},
 {t:'Explain anything simply', i:'🔍', p:[
  ['C','I want to understand [TOPIC]. I know [WHAT YOU ALREADY KNOW, or "nothing yet"]. I need it because [REASON].'],
  ['R','Act as a great teacher who explains hard things using everyday examples.'],
  ['A','Explain it simply, then check my understanding.'],
  ['F','1) A one-sentence summary. 2) A simple explanation with an everyday comparison. 3) 3 key terms defined. 4) 3 quiz questions with answers hidden at the bottom.'],
  ['T','Friendly and simple, like explaining to a smart 12-year-old.']]},
 {t:'Create a reusable template', i:'📄', p:[
  ['C','I often need to write [TYPE: thank-you notes to clients, job descriptions, product descriptions, invoices reminders]. The details that change each time: [WHAT CHANGES].'],
  ['R','Act as a professional writer who creates templates for businesses.'],
  ['A','Write a fill-in-the-blank template I can reuse, plus one filled-in example.'],
  ['F','The template with blanks in [BRACKETS], then "Example" with the blanks filled in. Under 200 words each.'],
  ['T','[TONE YOU WANT].']]},
]}
};
