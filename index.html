LIB.strategy = {name:"📈 Business Strategy", d:"Highly detailed prompts for ads, marketing plans, competitors, pricing and growth. The more blanks you fill in, the better the plan.", items:[
 {t:"Google Ads campaign — full build", i:"🎯", p:[
  ["C","Business: [BUSINESS NAME], a [TYPE OF BUSINESS] in [CITY, STATE]. We serve customers within [MILES / LIST OF TOWNS]. Our main services, in order of importance: [SERVICE 1, SERVICE 2, SERVICE 3]."],
  ["C","Goal: get more [PHONE CALLS / FORM LEADS / BOOKINGS / STORE VISITS]. Daily ad budget: [$ AMOUNT]. An average new customer is worth [$ AMOUNT] the first time and about [$ AMOUNT] over a year. We can afford to pay up to [$ AMOUNT] per new customer. Business hours: [HOURS]."],
  ["C","Our website / landing page: [URL]. What makes us different: [e.g. same-day service, family-owned 20 years, free estimates, 5-star reviews]. Main competitors: [NAMES]. Past Google Ads experience: [NONE / WHAT WE TRIED + RESULTS]."],
  ["R","Act as a Google Ads certified strategist with 10+ years of experience running profitable campaigns for local small businesses."],
  ["A","Build a complete, ready-to-launch Google Ads plan. Include: (1) which campaign type to use (Search, Performance Max, Local Services Ads) and why; (2) campaign and ad group structure, organized by service; (3) 15–25 keywords per ad group with match types; (4) a negative keyword list to block wasted clicks (jobs, free, DIY, etc.); (5) for each ad group, 15 headlines (max 30 characters each) and 4 descriptions (max 90 characters each); (6) assets: sitelinks, callouts, call asset, location asset; (7) location, radius and ad schedule settings; (8) starting bid strategy and when to switch; (9) conversion tracking I must set up before launch; (10) budget split across campaigns; (11) target cost per lead based on my numbers; (12) a week 1 / month 1 / month 2–3 optimization checklist."],
  ["F","Use a heading for each of the 12 parts. Put keywords, ads and budget in tables. Count characters on every headline and description and show the count. Do not invent search volumes or cost-per-click numbers — label any estimate as an estimate and tell me to check it in Google Keyword Planner. End with a “Launch Day Checklist” with checkboxes (☐)."],
  ["T","Expert but beginner-friendly: explain every Google Ads term in one plain sentence the first time you use it."]]},
 {t:"Google Ads — audit & fix an existing campaign", i:"🩺", p:[
  ["C","My Google Ads campaign for [BUSINESS / SERVICE] in [AREA] has been running for [TIME]. Last 30 days: spend [$], clicks [#], cost per click [$], conversions [#], cost per conversion [$]. A good customer is worth [$]. Here is my search terms report / keyword list / ad text: [PASTE DATA — remove account IDs]."],
  ["R","Act as a senior Google Ads auditor who has fixed hundreds of under-performing small-business accounts."],
  ["A","Audit this campaign. Find wasted spend, weak keywords, missing negatives, weak ads and tracking problems. Rank every fix by how much money it will likely save or earn."],
  ["F","1) A health score out of 10 with one-sentence reason. 2) Table: Problem | Evidence from my data | Fix | Priority (High/Med/Low). 3) New negative keywords list. 4) 5 rewritten headlines. 5) The 3 things to do this week."],
  ["T","Direct and honest. If my data is not enough to judge something, say so."]]},
 {t:"90-day marketing plan", i:"🗓️", p:[
  ["C","Business: [NAME + WHAT YOU SELL]. Location / market: [AREA or ONLINE]. Ideal customer: [WHO, AGE, PROBLEM THEY HAVE]. Current monthly revenue: [$] — goal in 90 days: [$ or # NEW CUSTOMERS]. Marketing budget: [$ per month]. Time I can spend: [HOURS per week]. What we do now: [CURRENT MARKETING]. What has worked / not worked: [DETAILS]."],
  ["R","Act as a fractional Chief Marketing Officer for small businesses."],
  ["A","Create a 90-day marketing plan focused on the 2–3 channels most likely to hit my goal with my budget. Explain why you chose them and why you left others out. Include weekly tasks, content ideas and how to measure results."],
  ["F","Sections: Strategy Summary (5 bullets) · Chosen Channels + Why · Budget Split (table) · Month 1 / Month 2 / Month 3 (week-by-week task tables: Week | Task | Owner | Time) · KPIs to track weekly (table with target numbers) · What to stop doing."],
  ["T","Practical, no fluff, realistic for a small team."]]},
 {t:"Competitor analysis", i:"🔭", p:[
  ["C","My business: [NAME, WHAT YOU SELL, PRICE RANGE, LOCATION]. Competitors: [COMPETITOR 1 + website], [COMPETITOR 2 + website], [COMPETITOR 3 + website]. What I know about them: [PRICES, REVIEWS, ADS, OFFERS you have seen]."],
  ["R","Act as a competitive-intelligence analyst."],
  ["A","Compare us with each competitor, find the gaps they leave open, and recommend how we can stand out and win their customers."],
  ["F","1) Comparison table: Business | Price | Main offer | Strengths | Weaknesses | Online reviews | Marketing channels. 2) 3 “gaps” we can own. 3) A one-sentence positioning statement for us. 4) 5 action steps. Mark anything you are guessing as “needs checking.”"],
  ["T","Objective and strategic."]]},
 {t:"Pricing & package strategy", i:"🏷️", p:[
  ["C","I sell [PRODUCT / SERVICE] to [CUSTOMER TYPE]. Current price: [$]. My cost to deliver: [$ + HOURS]. Competitors charge: [RANGES]. Customers often say: [OBJECTIONS or PRAISE about price]. Goal: [MORE SALES / HIGHER PROFIT / BIGGER ORDERS]."],
  ["R","Act as a pricing strategist for small businesses."],
  ["A","Design a Good / Better / Best package lineup, recommend prices, and explain the psychology behind each choice. Show my profit on each package."],
  ["F","Table: Package | What is included | Price | My cost | Profit | Who it is for. Then: which package to push and why, how to present prices on a call or website, and 2 add-ons to increase order size."],
  ["T","Confident and clear."]]},
 {t:"Ideal customer profile", i:"👤", p:[
  ["C","Business: [WHAT YOU SELL]. My best 3 customers so far: [DESCRIBE EACH: type, size, why they bought, what they love]. Customers who were a bad fit: [DESCRIBE]."],
  ["R","Act as a market researcher."],
  ["A","Create a detailed ideal customer profile so I can target the right people in ads, calls and emails."],
  ["F","Sections: Who they are · Their top 5 problems · What they want · Where they spend time (online & offline) · Words they use · Objections · What makes them buy now · 3 headline ideas that speak to them."],
  ["T","Specific and practical — avoid generic descriptions."]]},
 {t:"One-page business plan", i:"📑", p:[
  ["C","Business idea: [IDEA]. Target customers: [WHO]. Location: [AREA]. Starting money: [$]. My skills and experience: [DETAILS]. Time I can commit: [HOURS / WEEK]."],
  ["R","Act as a small-business advisor and former bank loan officer."],
  ["A","Write a one-page business plan and point out the 3 biggest risks with how to reduce each."],
  ["F","Sections: Problem · Solution · Target Customer · Offer & Pricing · How We Get Customers · Startup Costs (table) · Simple 12-month Revenue Estimate (table, label all assumptions) · Top 3 Risks · First 5 Steps."],
  ["T","Honest and encouraging — tell me if the numbers look unrealistic."]]},
 {t:"Facebook / Instagram ad campaign", i:"📣", p:[
  ["C","Business: [NAME + OFFER]. Location / area: [AREA]. Ideal customer: [WHO]. Goal: [LEADS / SALES / BOOKINGS]. Budget: [$ per day]. Offer or hook: [e.g. free estimate, first visit discount]. Landing page: [URL or “lead form”]. Rules: no health or income promises, follow Meta ad policies."],
  ["R","Act as a Meta (Facebook & Instagram) ads specialist for local businesses."],
  ["A","Plan the campaign: objective, audience targeting, budget, 3 ad concepts, and a testing plan to find the winner."],
  ["F","Sections: Campaign Setup (table) · Audiences · 3 Ad Concepts (each: hook, primary text under 125 characters, headline, image/video idea, call-to-action button) · Lead form questions · 14-day testing & decision rules."],
  ["T","Clear and beginner-friendly."]]},
]};

LIB.leads = {name:"📍 Local Lead Gen", d:"For running a lead-generation business that helps local small businesses with little or no online presence get found and get customers.", items:[
 {t:"📞 Cold calling script (ready to use)", i:"☎️", script:true, note:"Call business phone lines during business hours. Before calling any cell phone, check it against the National Do Not Call list, never use auto-dialers or recorded messages, and if anyone asks to be removed, remove them right away and do not call back. Rules vary by state — check yours.", secs:[
  ["1. Opener (first 10 seconds)","Hi, is this [OWNER NAME]?\n\nHi [OWNER NAME], this is [YOUR NAME] with [YOUR COMPANY] here in [CITY]. I know I’m calling out of the blue — can I take 30 seconds to tell you why I called, and then you can tell me if it’s worth talking more?"],
  ["2. Reason for the call (the hook)","I was searching Google for “[THEIR SERVICE] near me” here in [CITY], and I noticed [BUSINESS NAME] didn’t show up on the map — but [COMPETITOR NAME] did, with [NUMBER] reviews.\n\nThat means when people nearby search for what you do, they’re calling your competitors first. I help local businesses like yours show up on Google and get more calls — usually without a big monthly bill."],
  ["3. Discovery questions (ask, then listen)","• Right now, where do most of your new customers come from?\n• Have you ever set up a Google Business Profile or a website?\n• If you could handle more customers each month, how many more would make a real difference?\n• What is one new customer usually worth to you?"],
  ["4. Value statement","Here’s what I do: I set up and manage your Google Business Profile, get you a simple website that brings in calls, and help you collect reviews from happy customers. For a [THEIR TYPE OF BUSINESS], even [2–3] extra customers a month is about [$ VALUE] in new business."],
  ["5. Close for a short meeting","I’ve actually put together a free 1-page report showing exactly where you show up on Google compared with [COMPETITOR]. Could I walk you through it for 15 minutes — would [DAY] at [TIME] or [DAY] at [TIME] work better?\n\nGreat — what’s the best email or cell to send the calendar invite to?"],
  ["6. Objection: “I’m not interested.”","Totally fair — most owners say that before they see the report. Can I ask, is it because you have all the customers you need right now, or because you’ve been burned by marketing people before?"],
  ["7. Objection: “Just send me some information.”","Happy to. So I send something useful and not generic — what’s the #1 thing you’d want more of: phone calls, walk-ins, or bigger jobs? … I’ll send the report today. Can we put 10 minutes on the calendar for [DAY] so I can explain it?"],
  ["8. Objection: “I don’t have the money.”","I get it — that’s why I start small. The Google profile setup is [$ PRICE / “a one-time fee”], and it often pays for itself with one new customer. Would it be worth seeing the numbers before you decide?"],
  ["9. Objection: “I get all my business from word of mouth.”","That’s a great sign — it means people love your work. These days, even when someone gets a referral, most of them look you up on Google first. If they can’t find you, or they see a competitor with 50 reviews, some never call. I just make sure your word of mouth doesn’t get lost."],
  ["10. Objection: “I already have someone / tried it before.”","Good to hear you’re working on it. Out of curiosity, how’s it going — are you happy with the number of calls you’re getting? … If it would help, I’m happy to do a free second-opinion check, no strings attached."],
  ["11. Objection: “I’m too busy right now.”","I completely understand — that’s exactly why I called during the day and kept this short. When is a better time this week — early morning or after closing?"],
  ["12. Gatekeeper (someone else answers)","Hi, this is [YOUR NAME] with [YOUR COMPANY]. I’m calling for [OWNER NAME] about how [BUSINESS NAME] shows up on Google — when is the best time to catch them? … Could I get your name so I can say you were helpful?"],
  ["13. Voicemail (under 20 seconds)","Hi [OWNER NAME], this is [YOUR NAME] with [YOUR COMPANY] in [CITY]. I searched for “[THEIR SERVICE] near me” and noticed [BUSINESS NAME] isn’t showing up on Google Maps. I have a free one-page report showing how to fix that. Call or text me at [YOUR PHONE], that’s [YOUR PHONE]. Thanks!"],
  ["14. If they say “Please don’t call again”","Absolutely, I’ll take you off my list right now. Sorry to bother you — have a great day. (Then mark them “Do Not Call” in your tracker.)"],
  ["15. Tips","• Smile while you talk — people can hear it.\n• Stand up; you’ll sound more confident.\n• Ask a question, then stop talking and listen.\n• Your only goal is the 15-minute meeting — don’t try to sell everything on the first call.\n• Track every call: name, date, result, next step."]]},
 {t:"Build my lead-gen offer & packages", i:"🎁", p:[
  ["C","I am starting a local lead-generation business in [CITY / REGION]. I help small businesses that have little or no online presence (no Google Business Profile, no website, few reviews) get found online and get more customers. My skills: [SKILLS]. Tools I can use: [e.g. Google Business Profile, simple website builder, Google Ads, review tools]. Time available: [HOURS / WEEK]."],
  ["R","Act as a consultant who has built and sold local marketing agencies."],
  ["A","Design my service offer: 3 packages (starter, growth, premium), what each includes, suggested pricing (one-time setup + monthly), and which type of business each fits. Also suggest a pay-per-lead option and explain the pros and cons of each pricing model."],
  ["F","Package table: Package | Includes | Setup fee | Monthly | Best for. Then: Pay-per-lead option, my one-sentence elevator pitch, a guarantee I can safely offer, and the 3 easiest services to deliver first."],
  ["T","Practical and realistic for a one-person business."]]},
 {t:"Find & qualify target businesses", i:"🔎", p:[
  ["C","I run a local lead-gen service in [CITY / AREA, plus nearby towns]. I want small businesses that are good at their work but weak online, and where one new customer is worth enough to pay for my service."],
  ["R","Act as a sales strategist for local marketing services."],
  ["A","(1) List the 15 best types of local businesses to target and why (high customer value, depend on local searches). (2) Explain exactly how I can find businesses with no or weak online presence for free — e.g. searching Google Maps, local directories, Facebook groups, driving commercial streets, chambers of commerce. (3) Give me a 1–10 lead-scoring system."],
  ["F","1) Table: Business type | Typical customer value | Why they need me. 2) Step-by-step prospecting method (numbered). 3) Lead-score checklist (points for: no Google profile, no website, under 10 reviews, competitors outranking them, etc.). 4) Spreadsheet columns for my prospect tracker."],
  ["T","Clear, step-by-step, beginner-friendly."]]},
 {t:"Free “missed opportunity” report for a prospect", i:"📄", p:[
  ["C","Prospect: [BUSINESS NAME], a [TYPE] in [CITY]. What I found online: Google Business Profile [YES/NO/INCOMPLETE], website [YES/NO/OUTDATED], reviews [NUMBER + RATING], social media [DETAILS]. Top 3 competitors who show up instead: [NAMES + their review counts]. Searches I tested: [e.g. “plumber near me”, “plumber [CITY]”]."],
  ["R","Act as a local SEO expert who writes clear reports for busy business owners."],
  ["A","Write a one-page report showing what this business is missing online, what it may be costing them, and 3 quick wins. Only use the facts I gave you — label any estimate clearly as an estimate."],
  ["F","Title · “What customers see when they search” (3 bullets) · Comparison table (You vs. 3 competitors: Google profile, reviews, rating, website) · “What this may be costing you” (simple estimate with assumptions shown) · 3 Quick Wins · Next step: book a 15-minute call."],
  ["T","Helpful and respectful — never insulting. Owners should feel motivated, not embarrassed."]]},
 {t:"Customize my cold-call script for a niche", i:"🎙️", p:[
  ["C","I call local [NICHE: roofers, restaurants, salons, auto shops…] in [AREA] that have weak or no online presence. My offer: [YOUR SERVICES + PRICE RANGE]. Common objections I hear: [OBJECTIONS]. Here is my current script: [PASTE THE SCRIPT FROM THIS LIBRARY or YOUR OWN]."],
  ["R","Act as a top B2B cold-calling coach who trains sales teams for local marketing agencies."],
  ["A","Rewrite the script so it speaks directly to this niche: use their words, their typical customer value, and their biggest worries. Add 3 niche-specific objections with answers."],
  ["F","Same sections as my script: Opener, Hook, Discovery questions, Value, Close, Objections, Voicemail. Keep each spoken part under 40 words. Mark spots to pause with (pause)."],
  ["T","Natural and conversational — it must sound like a real person, not a robot or a pushy salesperson."]]},
 {t:"Cold email + text follow-up sequence", i:"📧", p:[
  ["C","I help local [NICHE] businesses in [AREA] get found on Google. Prospect: [BUSINESS NAME]. What I noticed: [THEIR MISSING ITEMS: no Google profile, few reviews…]. I [CALLED THEM / LEFT A VOICEMAIL / VISITED] on [DATE]. My offer: free one-page report + 15-minute call."],
  ["R","Act as a cold-outreach copywriter who writes short, personal messages."],
  ["A","Write a 4-step follow-up sequence over 10 days: email day 1, text day 3 (only if they gave me their cell or asked me to text), email day 6, final “closing the loop” email day 10."],
  ["F","For each: day, channel, subject line (emails), message under 80 words, one simple question at the end. Every email ends with my name, business address and a line saying “Reply STOP and I won’t email again.”"],
  ["T","Friendly, local and personal — like a neighbor offering help, not spam."]]},
 {t:"Walk-in / in-person pitch", i:"🚶", p:[
  ["C","I visit local businesses in person in [AREA]. Target: [NICHE]. I bring a printed one-page report showing how they appear on Google. Offer: [OFFER]. Owners are often busy with customers."],
  ["R","Act as a field sales trainer for local services."],
  ["A","Write a 60-second in-person pitch, what to say if the owner is not there, and how to follow up after the visit."],
  ["F","Sections: Best times to visit · Opening line · 60-second pitch (spoken script) · If the owner is busy / not there · Leave-behind note (under 50 words) · Follow-up call script for the next day."],
  ["T","Respectful of their time, confident, local."]]},
 {t:"Objection-handling practice partner", i:"🥊", p:[
  ["C","I sell [YOUR SERVICES] to local small business owners in [NICHE]. I am practicing my cold calls."],
  ["R","Act as a busy, skeptical small business owner who gets lots of sales calls. Stay in character."],
  ["A","Role-play a cold call with me. I will start. Raise realistic objections one at a time. After 6 back-and-forths, step out of character and grade my performance."],
  ["F","During the role-play: reply in 1–2 short sentences like a real owner. At the end: score out of 10, 3 things I did well, 3 things to improve, and better wording for my weakest answer."],
  ["T","Realistic — a little impatient, but fair."]]},
 {t:"Simple client service agreement", i:"✍️", p:[
  ["C","My business: [YOUR BUSINESS NAME], [STATE]. Client: [CLIENT BUSINESS]. Services: [LIST]. Price: [SETUP $ + MONTHLY $ or PER LEAD $]. Start date: [DATE]. Term: [MONTH-TO-MONTH / 3 MONTHS / etc.]. Cancellation: [NOTICE PERIOD]."],
  ["R","Act as a small-business contract drafter. (I understand this is a starting template, not legal advice, and I will have it reviewed.)"],
  ["A","Draft a plain-English service agreement covering: services, what the client must provide, payment terms, who owns accounts and content (the client should own their Google profile and website), no guaranteed results wording, cancellation, and signatures."],
  ["F","Numbered sections with short headings. Under 2 pages. Blanks in [BRACKETS] for anything you do not know."],
  ["T","Clear, fair and professional."]]},
 {t:"Monthly results report for a client", i:"📈", p:[
  ["C","Client: [BUSINESS NAME], [TYPE]. Services I provide: [SERVICES]. This month’s numbers: Google profile views [#], calls [#], website visits [#], direction requests [#], new reviews [#], leads delivered [#]. Last month: [SAME NUMBERS]. Work I did this month: [TASKS]."],
  ["R","Act as an account manager at a local marketing agency who keeps clients happy and renewing."],
  ["A","Write a short monthly report that shows results, explains changes in plain English, and lists next month’s plan. Only use my numbers — do not invent any."],
  ["F","Sections: Highlights (3 bullets) · Numbers table (Metric | Last month | This month | Change) · What we did · What’s next · One thing we need from you."],
  ["T","Positive, honest and easy to read in 2 minutes."]]},
]};

/* ---------- Video Creation ---------- */
LIB.video = {name:"🎬 Video Creation", d:"Prefilled prompts for short videos, animations and dramatic real estate videos. Every prompt spells out the camera type, angle, movement, speed and tone. The details are already filled in with strong choices — change any of them to match your project.", items:[
 {t:"🎥 Camera words cheat sheet (start here)", i:"📖", script:true, badge:"Guide", secs:[
  ["Camera TYPE (what films it)","• Drone — high, sweeping views from the sky\n• FPV drone — fast, swooping flight that can fly through doors and hallways\n• Gimbal — a handheld stabilizer for smooth, floating walking shots\n• Slider — a short rail for slow, smooth side-to-side moves\n• Tripod — perfectly still shots\n• Handheld — a little shaky; feels real and personal\n• Smartphone — easy, vertical, social-ready\n• Cinema camera — the most “movie-like” look\n• Lenses: wide-angle (shows more space), macro (extreme close-up of tiny details), telephoto (far away, blurry background)"],
  ["Camera ANGLE (where the camera looks from)","• Eye level — natural, like a person standing there\n• Low angle — camera looks UP; makes things feel big and powerful\n• High angle — camera looks DOWN; shows layout\n• Bird’s-eye / overhead — straight down from above\n• Over-the-shoulder — behind one person, looking at another\n• Dutch angle — tilted; feels tense or unusual"],
  ["Shot SIZE (how close)","• Extreme wide / establishing — the whole place\n• Wide — the whole subject\n• Medium — waist up, or one area of a room\n• Close-up — a face or one object\n• Extreme close-up — a tiny detail (an eye, a door handle, texture)"],
  ["Camera MOVEMENT","• Push-in (dolly in) — moves closer; builds drama\n• Pull-out (dolly out) — moves away; reveals more\n• Pan — turns left/right · Tilt — turns up/down\n• Orbit — circles around the subject\n• Tracking — follows a moving subject\n• Crane / pedestal — rises up or drops down\n• Reveal — starts blocked, then uncovers the subject"],
  ["SPEED","• Slow motion — slower than real life (filmed at 60–120 frames per second); feels dreamy and dramatic\n• Real-time — normal speed\n• Timelapse — hours squeezed into seconds (clouds, sunsets)\n• Hyperlapse — a moving timelapse\n• Speed ramp — fast, then suddenly slow (or the reverse); feels energetic\n• Camera speed — “slow, steady move” vs. “fast whip”"],
  ["TONE (the mood)","• Cinematic & dramatic · Warm & inviting · Luxurious & elegant · Fun & energetic · Calm & peaceful · Bold & powerful · Playful & cute\nTone comes from: lighting, colors, music, and how fast the edits are."]]},

 {t:"Short social video (AI video generator)", i:"📱", p:[
  ["C","I need a short vertical video for [PLATFORM: Instagram Reels / TikTok / YouTube Shorts] to promote [PRODUCT / SERVICE / IDEA]. My audience: [WHO]. I will create it with an AI video tool: [TOOL: Google Veo, Kling, Runway, Sora, or other]."],
  ["R","Act as a short-form video director and expert AI video prompt writer."],
  ["A","Write 3 ready-to-paste prompts for my AI video tool — one for each clip — that together make one 15–20 second video: a hook, the main moment, and an ending shot. Then tell me how to put them together."],
  ["F","Each clip prompt must clearly state:\nCamera type: smartphone-style handheld for the hook, gimbal for the main moment, tripod for the ending\nCamera angle: low angle for the hook, eye level for the main moment, overhead for the ending\nShot size: close-up → medium → wide\nCamera movement: quick push-in → smooth tracking → slow pull-out\nSpeed: speed ramp on the hook, real-time main moment, slight slow motion on the ending\nLighting: bright natural daylight\nAspect ratio: 9:16 vertical · Length: 5–8 seconds each\nAfter the 3 prompts, give me: on-screen text for each clip (under 6 words), a caption, and a music style."],
  ["T","Fun, energetic and scroll-stopping. Fast and punchy in the first 2 seconds."]]},

 {t:"Edit my own footage into a Reel / TikTok", i:"✂️", p:[
  ["C","I filmed these clips on my phone: [LIST EACH CLIP: what it shows + how long]. The video is for [PLATFORM] and should get viewers to [GOAL: follow, buy, book, visit]. I edit with [APP: CapCut, InShot, iMovie, Premiere]. I am a beginner."],
  ["R","Act as a professional short-form video editor."],
  ["A","Create a step-by-step edit plan: which clips to use, in what order, where to cut, and exactly which buttons/tools to use in my app."],
  ["F","A shot-by-shot table: # | Clip | Start–end time | Camera angle it shows | Speed (normal / slow motion / speed ramp) | Transition | On-screen text.\nTarget length: 20–30 seconds, vertical 9:16.\nPacing: a new cut every 1–2 seconds in the first 5 seconds, then every 2–3 seconds.\nThen: music style + where the beat drops, caption, and 3 hashtags. Finish with beginner app instructions as numbered steps."],
  ["T","Upbeat and modern — quick cuts, clean text, nothing cheesy."]]},

 {t:"Dramatic luxury real estate video — full shot list", i:"🏡", p:[
  ["C","I am making a listing video for a [HOME TYPE: e.g. 4-bed modern home] at [AREA / CITY]. Best features: [e.g. pool, ocean view, chef’s kitchen, high ceilings, big backyard]. Video length: 60–90 seconds, plus a 30-second vertical cut for social. Gear I have: [e.g. drone, gimbal, camera or phone, slider]. Important: the video must show the property accurately — no fake features, and no hiding real problems."],
  ["R","Act as a cinematic real estate videographer who shoots luxury listings."],
  ["A","Create a complete shot list, shooting schedule and edit plan for a dramatic, high-end listing video."],
  ["F","A shot-by-shot table with columns: # | Location | Camera type | Camera angle | Shot size | Movement | Speed | Lighting / time of day | Length.\nUse these as the backbone and add more:\n1. Opening: drone, high angle, extreme wide, slow forward push toward the house, real-time, golden hour\n2. Front-door reveal: gimbal, eye level, medium, slow walk-in through the door, slow motion 60fps\n3. Living room: gimbal, eye level, wide-angle lens, slow pull-out to show the full space, slow motion\n4. Kitchen details: slider, low angle, close-up of counters/fixtures, slow side slide, slow motion\n5. Bedroom: tripod, eye level, wide, locked still shot with light coming through the window, real-time\n6. Backyard / pool: drone, low altitude, slow orbit around the pool, real-time\n7. Twilight finale: drone, high angle, pull-back and rise over the home with lights on at dusk, slow\nThen: shooting order for one day, music style with timing of the drop, text overlays (price, beds/baths, agent name), and color grade."],
  ["T","Cinematic, dramatic and luxurious — slow, smooth, confident camera moves, warm golden light, moody music that builds."]]},

 {t:"Real estate — edit, music & captions plan", i:"🎞️", p:[
  ["C","I already filmed a home at [ADDRESS AREA] with [LIST YOUR CLIPS: drone, kitchen, living room, pool…]. I edit in [APP]. I need a 60-second horizontal video for YouTube/MLS and a 30-second vertical version for Instagram/TikTok."],
  ["R","Act as a real estate video editor who makes listings feel like movie trailers."],
  ["A","Build the edit plan for both versions, including the order of shots, music, text and transitions."],
  ["F","For each version, a table: Time | Clip | Camera angle | Speed (slow motion / real-time / speed ramp) | Transition (match cut, fade, whip pan) | Text on screen.\nRules: open with the most dramatic drone shot in the first 3 seconds; slow motion on interiors; cut on the music beats; end on the twilight exterior + agent contact card.\nAdd: music style and BPM (song speed), color grade (warm, bright, slightly high contrast), and a 3-line listing caption."],
  ["T","Dramatic but welcoming — buyers should feel “I want to live there.”"]]},

 {t:"Agent / business intro video", i:"🎙️", p:[
  ["C","I am [NAME], a [ROLE: real estate agent, business owner] in [AREA]. I want a 60-second “meet me” video for my website and social media. What makes me different: [DETAILS]. I film with [PHONE / CAMERA] and have [a friend to help / just me + tripod]."],
  ["R","Act as a personal-brand video director."],
  ["A","Write the script and a shot plan I can film myself in one afternoon."],
  ["F","Script: 120–150 spoken words, split into short lines.\nShot plan table: # | What I say or do | Camera type | Camera angle | Shot size | Movement | Speed | Location.\nInclude: main talking shot (tripod, eye level, medium close-up, still, real-time), walking intro shot (gimbal, eye level, tracking, real-time), B-roll of me working (handheld, varied angles, slow motion), and an ending wave or smile (tripod, close-up).\nAdd tips for lighting (face a window) and sound (use a clip-on mic)."],
  ["T","Warm, confident and approachable — like meeting a friendly neighbor."]]},

 {t:"Cinematic product video (AI or real footage)", i:"✨", p:[
  ["C","Product: [PRODUCT + what it looks like: color, size, packaging]. Brand style: [e.g. clean & modern, bold & sporty]. Platform: [WEBSITE / ADS / SOCIAL]. Rules: show the product only — no health or medical claims in text or voiceover."],
  ["R","Act as a commercial product videographer."],
  ["A","Plan a 15-second cinematic product video, and write ready-to-paste prompts for [AI VIDEO TOOL] for each shot in case I generate them instead of filming."],
  ["F","Shots:\n1. Macro lens, extreme close-up, slow slide across the label texture, slow motion, dark background with a soft rim light\n2. Tripod, low angle, product in center, slow 180° orbit, real-time, dramatic side light\n3. Overhead (bird’s-eye), product with ingredients or props around it, slow push-in, real-time\n4. Hand reaching into frame and picking it up, eye level, medium, speed ramp (fast → slow)\n5. Hero shot: eye level, still, logo and tagline appear\nFor each shot give: the filming setup AND the AI prompt. Then music style and text overlays."],
  ["T","Premium, sleek and bold — slow and smooth, with one energetic speed ramp."]]},

 {t:"2D explainer animation", i:"🖍️", p:[
  ["C","I need a 60-second animated explainer video about [TOPIC / PRODUCT / SERVICE] for [AUDIENCE]. Main message: [ONE SENTENCE]. I will make it in [TOOL: Canva, Vyond, Animaker, After Effects, or an AI tool]."],
  ["R","Act as an animation director and scriptwriter for explainer videos."],
  ["A","Write the voiceover script and a scene-by-scene storyboard."],
  ["F","Storyboard table: Scene | Time | Voiceover | What we see | Virtual camera angle | Shot size | Camera movement | Animation speed | Text on screen.\nVirtual camera rules: open wide and slowly zoom in (push-in); use eye-level flat views for explaining; use a top-down view for steps or maps; quick zoom-in for key points.\nSpeed: smooth, medium-speed motion; bouncy “pop-in” for icons; slow fade on the final message.\nStyle: flat 2D, rounded shapes, [BRAND COLORS].\nVoiceover: about 150 words. End with a call to action."],
  ["T","Friendly, clear and upbeat — like a helpful teacher."]]},

 {t:"3D animated short scene (AI generator)", i:"🧸", p:[
  ["C","I want a short animated scene: [DESCRIBE THE STORY MOMENT: who the character is, where they are, what happens]. Use an original character I describe, not a famous one: [CHARACTER LOOK]. Tool: [AI VIDEO TOOL]. Length: 3 clips of 5–8 seconds."],
  ["R","Act as a 3D animation director and AI video prompt expert."],
  ["A","Write 3 ready-to-paste prompts that tell the scene as beginning, middle and end, keeping the character looking the same in every clip."],
  ["F","Each prompt must state:\nStyle: stylized 3D animation, soft lighting, rich colors\nVirtual camera type: cinematic virtual camera, shallow depth of field (blurry background)\nClip 1 — Camera angle: high angle, wide establishing; Movement: slow crane down toward the character; Speed: slow\nClip 2 — Camera angle: eye level, medium shot; Movement: gentle tracking alongside the character; Speed: real-time\nClip 3 — Camera angle: low angle, close-up on the character’s face; Movement: slow push-in; Speed: slight slow motion\nAspect ratio: [16:9 or 9:16]. Also give a “character description” paragraph to paste into every prompt for consistency."],
  ["T","Heartwarming and magical, with a little humor."]]},

 {t:"Animated logo intro", i:"💫", p:[
  ["C","Business: [NAME]. Logo description: [SHAPES, COLORS, TEXT]. Brand feel: [e.g. modern, playful, luxury]. Used at the start of my videos. Tool: [Canva, After Effects, CapCut, AI tool]."],
  ["R","Act as a motion graphics designer."],
  ["A","Design 3 different 3–5 second logo intro ideas and give step-by-step instructions for my tool."],
  ["F","For each idea: name, description, virtual camera angle (straight-on / slight low angle / top-down), virtual camera movement (slow push-in, orbit, pull-back reveal), speed (fast build then slow settle; ease-in and ease-out), effects (light sweep, particles, glow), sound effect idea.\nThen numbered steps to make my favorite."],
  ["T","Polished and memorable — not over the top."]]},

 {t:"Customer testimonial / interview video", i:"💬", p:[
  ["C","I am filming a customer talking about their experience with [BUSINESS / PRODUCT]. Location: [PLACE]. Gear: [PHONES / CAMERAS / MIC]. Final videos: one 60-second version and one 15-second clip. Rules: the customer must agree in writing to appear, the words must be their real opinion, and no health or income promises."],
  ["R","Act as a documentary-style interview director."],
  ["A","Plan the setup, write 10 interview questions that get natural stories, and create the edit plan."],
  ["F","Camera setup:\nCamera A — tripod, eye level, medium shot, subject slightly off-center looking just beside the lens, still, real-time\nCamera B — tripod or handheld, side angle (45°), close-up of the face, still\nB-roll — gimbal and handheld, mix of angles, slow motion, shots of them using the product / at the business\nLighting: soft light from a window at the side; blurry background\nThen: 10 questions, and an edit plan table: Time | Camera A/B/B-roll | What they say | Text on screen."],
  ["T","Real, honest and warm — it should feel like a conversation, not an ad."]]},

 {t:"Storyboard any video idea", i:"🗂️", p:[
  ["C","My video idea: [DESCRIBE IT]. Purpose: [GOAL]. Length: [SECONDS]. Format: [VERTICAL 9:16 / HORIZONTAL 16:9]. Gear or tool: [PHONE, DRONE, GIMBAL, AI VIDEO TOOL…]."],
  ["R","Act as a film director and storyboard artist."],
  ["A","Turn my idea into a complete storyboard I can film or generate shot by shot."],
  ["F","Table: Shot # | Time | What happens | Camera type | Camera angle | Shot size | Camera movement | Speed | Lighting | Sound / music | Text.\nMix shot sizes (wide → medium → close-up), and change the angle at least every 2 shots. Give each shot a reason (why this angle / speed helps the story).\nEnd with a shooting order that saves time."],
  ["T","[CHOOSE: cinematic & dramatic / fun & energetic / calm & peaceful / luxurious & elegant]."]]},
]};

/* ---------- Conflict Resolution ---------- */
LIB.conflict = {name:"🤝 Conflict Resolution", d:"Prompts to calm things down, understand both sides, and find a fair solution — at work, with customers, at home and in your neighborhood.", items:[
 {t:"🧭 Calm-down conversation guide (start here)", i:"📖", script:true, badge:"Guide", noteLabel:"🛟 Safety first", note:"If anyone is threatening you or you feel unsafe, this is not a conflict to talk through — leave the situation and contact local emergency services or the right authority (HR, a property manager, a lawyer).", secs:[
  ["1. Cool down first","Don’t reply while you’re angry. Wait at least an hour (or a night) before sending any heated message. Write it, then let Claude help you rewrite it calmly."],
  ["2. Listen to understand","Let the other person talk without interrupting. Then repeat back what you heard:\n“So what I’m hearing is [THEIR POINT]. Did I get that right?”"],
  ["3. Name the feeling, not the blame","Use “I” statements instead of “you” statements:\n✅ “I felt frustrated when the report came in late, because I had to explain it to the client.”\n❌ “You always mess up the deadlines.”"],
  ["4. Separate the person from the problem","Talk about the problem as something you both face together:\n“How can WE make sure this doesn’t happen again?”"],
  ["5. Find what both sides need","Positions are what people say they want. Needs are WHY they want it. Ask:\n“What matters most to you about this?”"],
  ["6. Brainstorm options together","List 3–4 possible solutions before picking one. Avoid “my way or your way.”"],
  ["7. Agree and follow up","Say the agreement out loud or write it down: who does what, by when. Check in a week later:\n“Is our plan still working for you?”"],
  ["Helpful phrases","• “I can see why that would be upsetting.”\n• “Help me understand what happened from your side.”\n• “What would a fair solution look like to you?”\n• “I was wrong about ___, and I’m sorry.”\n• “Can we take a short break and come back to this at [TIME]?”"]]},

 {t:"Rewrite my angry message calmly", i:"🧊", p:[
  ["C","I’m upset with [WHO: coworker, client, family member, neighbor] because [WHAT HAPPENED]. Here is the message I want to send: [PASTE YOUR DRAFT]. What I really want to happen: [OUTCOME]."],
  ["R","Act as a calm, wise communication coach."],
  ["A","Rewrite my message so it is honest about how I feel but will not make the situation worse. Keep my main point. Point out any words in my draft that could start a fight."],
  ["F","1) “Risky words” list with why each could backfire. 2) A calm rewrite under 120 words. 3) An even shorter version (under 50 words) for a text message."],
  ["T","Calm, respectful and firm — not weak, not aggressive."]]},

 {t:"Mediate a conflict between two coworkers", i:"⚖️", p:[
  ["C","I am [YOUR ROLE: manager / team lead / coworker asked to help]. Two people on my team, [PERSON A ROLE] and [PERSON B ROLE], are in conflict about [ISSUE]. Person A says: [THEIR SIDE]. Person B says: [THEIR SIDE]. It is affecting [WORK / TEAM MOOD / CUSTOMERS]. It has been going on for [HOW LONG]."],
  ["R","Act as a neutral, experienced workplace mediator."],
  ["A","Help me run a fair mediation meeting. Summarize each side neutrally, find what each person truly needs, and suggest possible solutions both could accept."],
  ["F","Sections: Neutral summary of each side (no blame words) · What each person likely needs (table: Person | Says they want | Underlying need) · Meeting plan with ground rules and an exact opening statement I can read · 5 questions to ask during the meeting · 3 possible solutions · A short written agreement template (who does what, by when, check-in date)."],
  ["T","Fair, calm and neutral — do not take sides."]]},

 {t:"Disagreement with my boss", i:"👔", p:[
  ["C","My manager [WHAT THEY DID OR DECIDED: e.g. changed my accounts, criticized my work, denied time off]. My view: [YOUR SIDE + FACTS]. I want to keep a good relationship and my job. What I would like to happen: [OUTCOME]."],
  ["R","Act as an experienced career coach who helps people handle tough conversations with managers."],
  ["A","Help me prepare a respectful conversation that explains my side, shows I understand theirs, and suggests a solution."],
  ["F","1) How my manager probably sees this (3 bullets). 2) A short script: opening line, my main points, my suggested solution, closing. 3) Table: “If they say… → I can say…” (4 rows). 4) What NOT to say. 5) A follow-up email to send after the meeting to confirm what we agreed."],
  ["T","Professional, confident and respectful."]]},

 {t:"Calm down an angry customer or client", i:"😤", p:[
  ["C","I am [YOUR ROLE] at [BUSINESS TYPE]. A customer/client is upset because [WHAT HAPPENED]. They said: [WHAT THEY SAID OR PASTE THEIR MESSAGE]. What I am able to offer: [OPTIONS: refund, credit, redo, discount, escalate]. What I cannot do: [LIMITS]."],
  ["R","Act as a customer service expert trained in de-escalation."],
  ["A","Give me a response that calms them down, takes responsibility for what we got wrong (without admitting to things that are not true), and offers a clear fix."],
  ["F","1) A phone script with 4 steps: Listen & acknowledge → Apologize for the experience → Offer the fix → Confirm next steps. 2) A written reply (email or text) under 150 words. 3) What to say if they stay angry or demand something I cannot give."],
  ["T","Warm, patient, sincere and solution-focused — never defensive."]]},

 {t:"Family or partner disagreement", i:"🏠", p:[
  ["C","My [RELATIONSHIP: partner, parent, sibling, adult child] and I keep disagreeing about [TOPIC: money, chores, holidays, parenting…]. My side: [YOUR VIEW]. Their side (as fairly as I can say it): [THEIR VIEW]. What usually happens when we talk about it: [PATTERN]. I want: [OUTCOME]."],
  ["R","Act as a warm, experienced family counselor. (I understand you are not a replacement for a licensed therapist.)"],
  ["A","Help me understand both sides and plan a calm conversation where we both feel heard and can find a middle ground."],
  ["F","Sections: What each of us probably needs underneath (2–3 bullets each) · A good time/place to talk · Gentle opening words · 3 “I” statements I can use · 3 possible compromises · What to do if it starts getting heated."],
  ["T","Kind, balanced and hopeful — no blaming either person."]]},

 {t:"Neighbor or roommate problem", i:"🏘️", p:[
  ["C","My [NEIGHBOR / ROOMMATE] keeps [PROBLEM: noise, parking, trash, pets, shared bills, cleaning]. It has happened [HOW OFTEN] since [WHEN]. What I have already tried: [ANYTHING]. Our relationship right now: [FRIENDLY / AWKWARD / TENSE]. Any rules that apply: [LEASE, HOA RULES, CITY NOISE RULES — if you know them]."],
  ["R","Act as a community mediator who helps neighbors solve problems without escalating."],
  ["A","Give me a step-by-step plan, starting with the friendliest option and only moving to stronger steps if needed."],
  ["F","Steps: 1) Friendly in-person talk (exact words). 2) A polite written note (under 80 words). 3) Written request with specific dates. 4) Involving a third party (landlord, HOA, community mediation service). For each step: when to use it and what to say. Also tell me how to keep a simple record of incidents."],
  ["T","Friendly, neighborly and calm."]]},

 {t:"Co-parenting message", i:"👨‍👧", p:[
  ["C","I co-parent with [RELATIONSHIP]. The issue: [SCHEDULE, PICKUPS, EXPENSES, RULES AT EACH HOUSE…]. What happened: [DETAILS]. Our children are [AGES]. Any court order or parenting plan says: [RELEVANT PART, if any]. What I want: [OUTCOME]."],
  ["R","Act as a co-parenting communication coach who keeps the focus on the children."],
  ["A","Write a message that stays business-like, sticks to facts, focuses on the kids, and proposes a clear solution."],
  ["F","A message under 120 words using the BIFF style: Brief, Informative, Friendly, Firm. Then one shorter version. Then 3 tips for responding if they reply with something hurtful."],
  ["T","Neutral, polite and child-focused — no blame, no sarcasm, no old arguments."]]},

 {t:"Apologize the right way", i:"🙏", p:[
  ["C","I need to apologize to [WHO] for [WHAT I DID]. How it affected them: [IMPACT]. Why it happened (not as an excuse): [CONTEXT]. What I will do differently: [CHANGE]. Method: [IN PERSON / CALL / TEXT / EMAIL / LETTER]."],
  ["R","Act as an emotional-intelligence coach."],
  ["A","Write a sincere apology that takes full responsibility, shows I understand how they feel, and explains how I will make it right."],
  ["F","The apology (under 120 words) following these steps: say sorry clearly → name what I did → show I understand the impact → no “but” or excuses → how I will fix it / do better → ask what else would help. Then a list of phrases to avoid (like “I’m sorry if you felt…”)."],
  ["T","Sincere, humble and genuine."]]},

 {t:"Say no / set a boundary politely", i:"🛑", p:[
  ["C","[WHO] keeps asking me to [REQUEST: extra work, favors, borrow money, last-minute changes]. I want to say no because [REASON]. I want to keep a good relationship with them. Situation: [WORK / FAMILY / FRIEND / CLIENT]."],
  ["R","Act as an assertiveness coach."],
  ["A","Give me kind but clear ways to say no and hold my boundary if they push back."],
  ["F","1) Three versions: very gentle, balanced, firm (each under 40 words). 2) An alternative I could offer instead, if I want to. 3) What to say if they push back a second time. 4) What to say if they get upset."],
  ["T","Kind, clear and confident — no over-explaining or guilt."]]},

 {t:"Neutral summary of a dispute (both sides)", i:"📋", p:[
  ["C","There is a dispute between [PARTY A] and [PARTY B] about [ISSUE]. Facts both sides agree on: [FACTS]. Party A says: [CLAIM + EVIDENCE]. Party B says: [CLAIM + EVIDENCE]. Any written agreement, policy or rules: [PASTE OR DESCRIBE]."],
  ["R","Act as a neutral, independent arbitrator who looks only at facts and fairness. (I understand this is not legal advice.)"],
  ["A","Lay out both sides fairly, separate facts from opinions, point out what information is missing, and suggest fair ways to resolve it."],
  ["F","Sections: Agreed facts · Disputed facts (table: Point | A says | B says | Evidence) · What is still unknown · Relevant rules/agreement terms · 3 fair resolution options with pros and cons for each side · Questions each party should answer next."],
  ["T","Strictly neutral, calm and factual."]]},

 {t:"Practice a tough conversation (role-play)", i:"🎭", p:[
  ["C","I need to talk to [WHO] about [ISSUE]. They usually react by [GETTING DEFENSIVE / SHUTTING DOWN / GETTING LOUD / CHANGING THE SUBJECT]. My goal: [OUTCOME]."],
  ["R","Play the role of [WHO], acting the way I described. Stay in character until I type “STOP.”"],
  ["A","Role-play the conversation with me so I can practice. I will start. When I type “STOP,” step out of character and coach me."],
  ["F","During role-play: answer in 1–3 sentences, like a real person. After “STOP”: score my calmness and clarity out of 10, what I did well, what to improve, and 3 better phrases I could use."],
  ["T","Realistic but fair — challenging enough to be useful."]]},
]};

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
function toast(msg){
  let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600);
}
function showCopyBox(txt){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card pop" style="max-width:640px;width:100%"><h3>Copy this prompt</h3><p class="muted">Your browser blocked automatic copying. The text below is already selected — press <b>Ctrl + C</b> (or long-press and choose Copy on a phone).</p><textarea readonly style="width:100%;height:260px;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)"></textarea><div class="actions"><button class="btn">Done</button></div></div>`;
  document.body.appendChild(m); const ta=m.querySelector('textarea'); ta.value=txt; ta.focus(); ta.select();
  m.querySelector('.btn').onclick=()=>m.remove(); m.onclick=e=>{ if(e.target===m) m.remove(); };
}

 {t:"AI options for the luxury video: text-to-video vs. photo-to-video", i:"🤖", script:true, badge:"Guide", noteLabel:"🏠 Keep listings honest", note:"Anything that shows the actual home must look exactly like the real home. Never use AI to add features, change views, hide problems, or make rooms look bigger. Many MLS rules and advertising laws require accurate listings. Label any AI-created or virtually staged shots.", secs:[

function startPreview(ov){
  if(PREV) cancelAnimationFrame(PREV.raf);
  const cv=$('#prev'); const vertical=ST.ar==='9:16'||ST.ar==='4:5'||ST.ar==='1:1'; const sz=AR_SIZES[ST.ar]||[960,540];
  cv.width = sz[0]; cv.height = sz[1];
  cv.style.maxWidth = ST.ar==='9:16'?'320px':ST.ar==='4:5'?'380px':ST.ar==='1:1'?'420px':'100%';
  const ctx=cv.getContext('2d'); const P=ST.photos.slice(), N=P.length, len=ST.len, ov_=0.75, step=len-ov_;
  const total=N*len-(N-1)*ov_+1.5;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  PREV={raf:0,playing:true,t0:performance.now(),offset:0};
  function drawImg(img,anim,p,alpha){
    if(!img.complete||!img.naturalWidth) return;
    const W=cv.width,H=cv.height, base=Math.max(W/img.naturalWidth,H/img.naturalHeight);
    let s=1.1,x=0,y=0; const e=ease(p), A=ST.amount/100;
    if(anim==='push') s=1.02+A*e;
    else if(anim==='pull') s=1.02+A*(1-e);
    else if(anim==='right'||anim==='left'){ s=1.02+A; x=((s-1)*W/2)*(1-2*e)*(anim==='left'?-1:1); }
    else if(anim==='rise'){ s=1.02+A; y=-((s-1)*H/2)*(1-2*e); }
    const w=img.naturalWidth*base*s, h=img.naturalHeight*base*s;
    ctx.globalAlpha=alpha; ctx.drawImage(img,(W-w)/2+x,(H-h)/2+y,w,h); ctx.globalAlpha=1;
  }
  function frame(now){
    const T = PREV.playing ? (now-PREV.t0)/1000 + PREV.offset : PREV.offset;
    const t = T % total;
    const W=cv.width,H=cv.height;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<N;i++){
      const st=i*step, en=st+len; if(t<st||t>en+ (i===N-1?1.5:0)) continue;
      let a=1; if(i>0 && t<st+ov_) a=(t-st)/ov_;
      if(i===N-1 && t>en) a=Math.max(0,1-(t-en)/1.5);
      drawImg(P[i].img, MOTIONS[effMv(P[i])].anim, Math.min(1,(t-st)/len), a);
    }
    const L=LOOKS[ST.look];
    ctx.globalCompositeOperation='soft-light'; ctx.fillStyle=L.fx; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over';
    const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.5)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(!vertical){ ctx.fillStyle='#000'; const bh=H*0.06; ctx.fillRect(0,0,W,bh); ctx.fillRect(0,H-bh,W,bh); }
    ov.forEach(o=>{ const s=o.clip*step+0.6, d=t-s; if(d<0||d>2.8) return;
      const a=d<0.5?d/0.5:d>2.3?(2.8-d)/0.5:1;
      ctx.globalAlpha=a; ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=12; ctx.textAlign='center';
      const fs = vertical?30:30; ctx.font=`500 ${fs}px Georgia, serif`;
      const txt=o.text.toUpperCase(); const lines = ctx.measureText(txt).width > W*0.86 ? txt.split(' · ') : [txt];
      lines.forEach((ln,k)=>ctx.fillText(ln.split('').join(' '),W/2,H*(vertical?0.78:0.80)+k*(fs+10)-((lines.length-1)*(fs+10))/2));
      ctx.shadowBlur=0; ctx.globalAlpha=1; });
    const el=$('#ptime'); if(!el){ return; }
    el.textContent=`${t.toFixed(1)}s / ${total.toFixed(0)}s · clip ${Math.min(N,Math.floor(t/step)+1)} of ${N}`;
    PREV.raf=requestAnimationFrame(frame);
  }
  PREV.raf=requestAnimationFrame(frame);
  $('#pp').onclick=()=>{ if(PREV.playing){ PREV.offset+=(performance.now()-PREV.t0)/1000; PREV.playing=false; $('#pp').textContent='▶ Play'; } else { PREV.t0=performance.now(); PREV.playing=true; $('#pp').textContent='⏸ Pause'; } };
  $('#rs').onclick=()=>{ PREV.offset=0; PREV.t0=performance.now(); PREV.playing=true; $('#pp').textContent='⏸ Pause'; };
}

/* --- Basic calculator --- */
let CALC = {expr:'', last:null, hist:[]};
function calcEval(s){
  const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+(?:e[+-]?\d+)?|[()+\-*/%]/g)||[];
  let i=0;
  const peek=()=>t[i], next=()=>t[i++];
  function prim(){ let x=peek();
    if(x==='-'){ next(); return -prim(); } if(x==='+'){ next(); return prim(); }
    if(x==='('){ next(); const v=add(); if(peek()===')') next(); return post(v); }
    next(); const v=parseFloat(x); if(!isFinite(v)) throw 0; return post(v); }
  function post(v){ while(peek()==='%'){ next(); v=v/100; } return v; }
  function mul(){ let v=prim(); while(peek()==='*'||peek()==='/'){ const o=next(), r=prim(); v= o==='*'?v*r:v/r; } return v; }
  function add(){ let v=mul(); while(peek()==='+'||peek()==='-'){ const o=next(), r=mul(); v= o==='+'?v+r:v-r; } return v; }
  const v=add(); if(i<t.length||!isFinite(v)) throw 0; return Math.round(v*1e10)/1e10;
}

function rCalc(){

  return {sub,disc,tax,tip,total:taxable+tax+tip,count:RCPT.items.reduce((a,x)=>a+x.qty,0)};
}
function drawReceipt(){
  const c=rCalc();

    ${c.tip?`<div><span>Tip (${RCPT.tip}%)</span><b>${money(c.tip)}</b></div>`:''}
    <div class="grand"><span>TOTAL</span><b>${money(c.total)}</b></div></div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ RCPT.items.splice(+b.dataset.del,1); saveRcpt(); drawReceipt(); });
  document.querySelectorAll('[data-q]').forEach(el=>el.onchange=()=>{ RCPT.items[+el.dataset.q].qty=parseFloat(el.value)||0; saveRcpt(); drawReceipt(); });

}
function receiptText(){
  const c=rCalc(), L=[];
  L.push((RCPT.title||'RECEIPT').toUpperCase()); L.push(new Date().toLocaleDateString()); L.push('------------------------------');
  RCPT.items.forEach(x=>L.push(`${x.qty} x ${x.name} @ ${money(x.price)} = ${money(x.qty*x.price)}`));

  if(c.tip) L.push(`Tip (${RCPT.tip}%): ${money(c.tip)}`);

function calcMortgage(){
  const price=num('#mPrice'), down=Math.min(num('#mDown'),price), loan=Math.max(0,price-down), rate=num('#mRate'), yrs=+$('#mTerm').value, n=yrs*12;
  const pi=payment(loan,rate,n), tax=num('#mTax')/12, ins=num('#mIns')/12, hoa=num('#mHoa');

  // yearly amortization
  let bal=loan; const r=rate/100/12, rows=[];
  for(let y=1;y<=yrs;y++){ let ip=0,pp=0; for(let m=0;m<12;m++){ const i=bal*r, pr=Math.min(bal,pi-i); ip+=i; pp+=pr; bal-=pr; } rows.push([y,pp,ip,Math.max(0,bal)]); }

      <div class="stat"><span>Total interest over ${yrs} years</span><b>${money(totalInt)}</b></div>
      <div class="stat"><span>Total of all loan payments</span><b>${money(pi*n)}</b></div>
    </div>
    ${LEVEL==='adv'&&loan>0?(()=>{ const e1=payoffWithExtra(loan,rate,n,pi,200), lower=payment(loan,Math.max(0,rate-1),n), p15=payment(loan,rate,180);
      return `<div class="lvlnote lv-adv" style="margin-top:12px"><b>🌳 Pro insights</b><ul class="steps" style="margin:6px 0 0">
        <li><b>Pay $200 extra per month:</b> paid off ${Math.floor((n-e1.months)/12)} yrs ${(n-e1.months)%12} mo sooner and saves about <b>${money(totalInt-e1.interest)}</b> in interest.</li>
        <li><b>A rate 1% lower</b> (${(Math.max(0,rate-1)).toFixed(2)}%) would cut principal & interest to ${money(lower)}/mo — ${money(pi-lower)} less every month (${money((pi-lower)*n)} over the loan). Worth shopping several lenders.</li>
        ${yrs!==15?`<li><b>15-year option:</b> ${money(p15)}/mo principal & interest, with total interest of ${money(p15*180-loan)} vs ${money(totalInt)} on your current term.</li>`:''}
        <li><b>Income guideline:</b> to keep housing under 28% of gross income, aim for roughly <b>${money(total/0.28*12)}</b>/year household income or more.</li></ul></div>`; })():''}
    ${pmi?`<p class="warnnote" style="margin-top:12px">With less than 20% down, lenders usually add PMI (mortgage insurance). Putting ${money(price*0.2-down)} more down would likely remove it.</p>`:''}
    <details class="presetbox" style="margin-top:12px"><summary>📅 Year-by-year breakdown</summary>
      <div style="overflow-x:auto"><table class="tbl"><tr><th>Year</th><th>Principal paid</th><th>Interest paid</th><th>Balance left</th></tr>
      ${rows.map(r=>`<tr><td>${r[0]}</td><td>${money(r[1])}</td><td>${money(r[2])}</td><td>${money(r[3])}</td></tr>`).join('')}</table></div></details>`;
}

function parseG(p){ const arr=(p&&(p.events||p.items))||(Array.isArray(p)?p:[]);
  return arr.map(e=>{ const st=toLocal(e.start||e.startTime), en=toLocal(e.end||e.endTime); if(!st) return null;
    return {id:'g_'+e.id, gid:e.id, google:true, title:e.summary||'(No title)', date:st.date, allDay:!!st.allDay, start:st.time||'', end:en&&en.time||'', loc:e.location||'', notes:(e.description||'').replace(/<[^>]+>/g,''), link:e.htmlLink||'', cat:'other'}; }).filter(Boolean); }
function watchGoogle(){
  if(GC.state!=='on') return;
  const [a,b]=gRange(), input={startTime:`${ymd(a)}T00:00:00`, endTime:`${ymd(b)}T00:00:00`, pageSize:250, orderBy:'startTime'}, key=JSON.stringify(input);
  if(key===GC.key) return; GC.key=key; if(GC.unsub){ try{ GC.unsub(); }catch(e){} }
  GC.pendingAsk=input;
  try{ GC.unsub=GC.mcp.watchTool(GSV,'list_events',input,ev=>{
    if(ev.type==='data'){ GC.events=parseG(ev.result.payload); GC.err=''; GC.storedAt=ev.result.cache?ev.result.cache.storedAt:Date.now(); redrawPlanner(); }
    else { const c=ev.error&&ev.error.code; if(['needs_reauth','server_not_connected','not_in_manifest','blocked_by_policy','approval_required','selection_required','not_granted','capability_disabled'].includes(c)) GC.events=[]; GC.err=c||'upstream_error'; redrawPlanner(); }
  },{refetchInterval:120000}); }catch(e){ GC.err='upstream_error'; }
}
async function gAllow(){ try{ const r=await GC.mcp.callTool(GSV,'list_events',GC.pendingAsk); GC.events=parseG(r.payload); GC.err=''; GC.storedAt=Date.now(); redrawPlanner(true); }catch(e){ GC.err=e.code||'upstream_error'; toast('⚠️ '+gMsg(e)); redrawPlanner(true); } }
function redrawPlanner(force){
  if(!$('#planBody')) return;
  const a=document.activeElement, busy=a&&$('#planBody').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(busy&&!force){ GC.dirty=true; return; }
  if(PV.mode==='month') drawMonth(); else if(PV.mode==='week') drawWeek(); else drawSync();
  const st=$('#gStatus'); if(st) st.outerHTML=gStatusHtml();
}
function gStatusHtml(){
  const on=GC.state==='on'&&!GC.err;
  const txt = GC.state==='checking'?'⏳ Checking Google Calendar…' : on?'🟢 Google Calendar synced' : GC.state==='on'&&GC.err==='approval_required'?'🟡 Google Calendar needs your OK' : GC.state==='on'?'🟠 Google Calendar issue' : '⚪ Google Calendar not linked here';
  return `<span id="gStatus" class="badge" style="margin:0;cursor:pointer" onclick="PV.mode='sync';plannerView()">${txt}</span>`;
}
function gInput(e){ const o={summary:e.title||'Event'};
  if(e.allDay||!e.start){ const n=parseYmd(e.date); n.setDate(n.getDate()+1); o.startTime=`${e.date}T00:00:00`; o.endTime=`${ymd(n)}T00:00:00`; o.allDay=true; }
  else { let en=e.end; if(!en||en<=e.start){ let [h,m]=e.start.split(':').map(Number); h=Math.min(23,h+1); en=`${pad(h)}:${pad(m)}`; } o.startTime=`${e.date}T${e.start}:00`; o.endTime=`${e.date}T${en}:00`; }
  if(e.loc) o.location=e.loc; if(e.notes) o.description=e.notes; return o; }
async function gSave(e, quiet){
  try{ const r=await GC.mcp.callTool(GSV,'create_event',gInput(e)); const p=r.payload||{}; const ev=p.event||p;
    e.gid=ev.id||ev.eventId||null; e.glink=ev.htmlLink||''; e.gsynced=true; savePlan(); GC.mcp.invalidate(GSV,'list_events').catch(()=>{});
    if(!quiet) toast('✅ Saved to Google Calendar'); return true;
  }catch(err){ toast('⚠️ '+gMsg(err)); return false; }
}
async function gUpdate(e){
  if(!e.gid){ toast('ℹ️ Updated here. Please also update it in Google Calendar.'); return; }
  try{ const o=gInput(e); o.eventId=e.gid; if(!o.allDay) o.allDay=false; await GC.mcp.callTool(GSV,'update_event',o); GC.mcp.invalidate(GSV,'list_events').catch(()=>{}); toast('✅ Updated in Google Calendar too'); }
  catch(err){ toast('⚠️ '+gMsg(err)); }
}
async function gDelete(gid){ try{ await GC.mcp.callTool(GSV,'delete_event',{eventId:gid}); GC.mcp.invalidate(GSV,'list_events').catch(()=>{}); return true; }catch(err){ toast('⚠️ '+gMsg(err)); return false; } }
function gcalLink(e){
  const base='https://calendar.google.com/calendar/render?action=TEMPLATE';
  let dates;
  if(e.allDay||!e.start){ const d=parseYmd(e.date); const n=new Date(d); n.setDate(n.getDate()+1); dates=`${ymd(d).replace(/-/g,'')}/${ymd(n).replace(/-/g,'')}`; }
  else { const st=e.date.replace(/-/g,'')+'T'+e.start.replace(':','')+'00'; let en=e.end;
    if(!en||en<=e.start){ let [h,m]=e.start.split(':').map(Number); h=Math.min(23,h+1); en=`${pad(h)}:${pad(m)}`; }
    dates=`${st}/${e.date.replace(/-/g,'')}T${en.replace(':','')}00`; }
  const q=new URLSearchParams({text:e.title||'Event', dates, details:e.notes||'', location:e.loc||''});
  if(TZ) q.set('ctz',TZ);
  return base+'&'+q.toString();
}
function eventsOn(day){
  const local=PLAN.events.filter(e=>e.date===day);
  const gids=new Set(local.map(e=>e.gid).filter(Boolean)), sig=new Set(local.filter(e=>e.gsynced).map(e=>e.title+'|'+(e.allDay?'':e.start)));
  const g=(GC.state==='on'?GC.events:[]).filter(e=>e.date===day&&!gids.has(e.gid)&&!sig.has(e.title+'|'+(e.allDay?'':e.start)));
  return [...local,...g].sort((a,b)=>(a.allDay?'':a.start||'').localeCompare(b.allDay?'':b.start||'')); }
function tasksOn(day){ return PLAN.tasks.filter(t=>t.date===day); }

function plannerView(){

  $('#app').innerHTML = `
    <div class="card pop">
      <div class="top"><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 style="margin:0">📅 Planner</h1>${gStatusHtml()}</span>
        <div class="tabs" style="margin:0">
          <button class="tab ${PV.mode==='month'?'on':''}" data-mode="month">🗓️ Month</button>
          <button class="tab ${PV.mode==='week'?'on':''}" data-mode="week">📋 Next 7 days</button>
          <button class="tab ${PV.mode==='sync'?'on':''}" data-mode="sync">🔄 Sync: Google & Apple</button>
        </div></div>

  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ PV.mode=b.dataset.mode; plannerView(); });

function drawMonth(){
  const m=PV.month, first=new Date(m.getFullYear(),m.getMonth(),1), start=new Date(first); start.setDate(1-first.getDay());
  const today=ymd(new Date()), cells=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  watchGoogle();
  const title=m.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  $('#planBody').innerHTML = `
    <div class="plangrid">
      <div class="card">
        <div class="top"><button class="qcopy" id="pPrev">◀</button><h2 style="margin:0">${title}</h2><button class="qcopy" id="pNext">▶</button></div>
        <div style="text-align:center;margin-top:6px"><button class="qcopy" id="pToday">Today</button></div>
        <div class="cal">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
          ${cells.map(d=>{ const k=ymd(d), ev=eventsOn(k), tk=tasksOn(k), open=tk.filter(t=>!t.done).length;
            return `<button class="day ${d.getMonth()!==m.getMonth()?'out':''} ${k===today?'today':''} ${k===PV.sel?'sel':''}" data-day="${k}">
              <span class="dn">${d.getDate()}</span>
              <span class="dots">${ev.slice(0,4).map(e=>`<i style="background:${e.google?'#4285F4':CATS[e.cat||'other'][1]}"></i>`).join('')}</span>
              ${open?`<span class="tk">✓${open}</span>`:''}
            </button>`; }).join('')}
        </div>
      </div>
      <div id="dayPanel"></div>
    </div>`;
  $('#pPrev').onclick=()=>{ PV.month=new Date(m.getFullYear(),m.getMonth()-1,1); drawMonth(); };
  $('#pNext').onclick=()=>{ PV.month=new Date(m.getFullYear(),m.getMonth()+1,1); drawMonth(); };
  $('#pToday').onclick=()=>{ const d=new Date(); PV.month=new Date(d.getFullYear(),d.getMonth(),1); PV.sel=ymd(d); drawMonth(); };
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ PV.sel=b.dataset.day; const d=parseYmd(PV.sel); if(d.getMonth()!==m.getMonth()) PV.month=new Date(d.getFullYear(),d.getMonth(),1); PV.editing=null; drawMonth(); });
  drawDay();
}
function eventRow(e){
  const c=e.google?['📆 Google Calendar','#4285F4']:CATS[e.cat||'other'];
  let acts;
  if(e.google) acts=`<span class="gtag">From Google</span>${e.link?`<a class="glink" href="${e.link}" target="_blank" rel="noopener">✏️ Open in Google</a>`:''}${e.gid?`<button class="xbtn" data-gdel="${esc(e.gid)}">🗑️</button>`:''}`;
  else if(GC.state==='on'&&!['not_in_manifest','blocked_by_policy','server_not_connected'].includes(GC.err)) acts=(e.gsynced?`<span class="gtag">✅ In Google Calendar</span>${e.glink?`<a class="glink" href="${e.glink}" target="_blank" rel="noopener">Open</a>`:''}`:`<button class="glink gbtn" data-gsave="${e.id}">☁️ Save to Google Calendar</button>`)+`<button class="xbtn" data-edit="${e.id}">✏️ Edit</button><button class="xbtn" data-delev="${e.id}">🗑️</button>`;
  else acts=`<a class="glink" href="${gcalLink(e)}" target="_blank" rel="noopener">📅 Add to Google Calendar</a><button class="xbtn" data-edit="${e.id}">✏️ Edit</button><button class="xbtn" data-delev="${e.id}">🗑️</button>`;
  return `<div class="ev" style="border-left-color:${c[1]}">
    <div style="flex:1;min-width:0">
      <div class="evt">${e.allDay||!e.start?'<span class="badge" style="margin:0 6px 0 0;font-size:12px;padding:1px 8px">All day</span>':`<b>${fmtTime(e.start)}${e.end?' – '+fmtTime(e.end):''}</b> · `}${esc(e.title)}</div>
      <div class="muted" style="font-size:13px">${c[0]}${e.loc?` · 📍 ${esc(e.loc)}`:''}</div>
      ${e.notes?`<div style="font-size:13px;margin-top:2px;white-space:pre-wrap">${esc(e.notes.slice(0,300))}</div>`:''}
      <div class="evactions">${acts}</div>
      <div class="delask" data-ask="${e.id}"></div>
    </div></div>`;
}
function bindEventActions(redraw){
  document.querySelectorAll('[data-gsave]').forEach(b=>b.onclick=async()=>{ const e=PLAN.events.find(x=>x.id===b.dataset.gsave); b.disabled=true; b.textContent='Saving…'; await gSave(e); redraw(); });
  document.querySelectorAll('[data-delev]').forEach(b=>b.onclick=()=>{ const e=PLAN.events.find(x=>x.id===b.dataset.delev); const box=document.querySelector(`[data-ask="${e.id}"]`);
    const both = GC.state==='on' && e.gid;
    box.innerHTML=`<div class="askrow">Delete “${esc(e.title)}”? ${both?`<button class="xbtn danger" data-d="both">Delete here & in Google</button><button class="xbtn" data-d="here">Only delete here</button>`:`<button class="xbtn danger" data-d="here">Delete</button>`}<button class="xbtn" data-d="no">Cancel</button></div>`;
    box.querySelectorAll('[data-d]').forEach(x=>x.onclick=async()=>{ const d=x.dataset.d; if(d==='no'){ box.innerHTML=''; return; }
      if(d==='both'){ x.textContent='Deleting…'; const ok=await gDelete(e.gid); if(!ok) return; }
      PLAN.events=PLAN.events.filter(y=>y.id!==e.id); savePlan(); redraw(); toast(d==='both'?'🗑️ Deleted here and in Google Calendar':'🗑️ Removed from planner'+(e.gsynced?' (still in Google Calendar)':'')); }); });
  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{ const gid=b.dataset.gdel, ev=GC.events.find(x=>x.gid===gid); const box=b.closest('.ev').querySelector('.delask');
    box.innerHTML=`<div class="askrow">Delete “${esc(ev?ev.title:'this event')}” from Google Calendar? <button class="xbtn danger" data-d="y">Delete from Google</button><button class="xbtn" data-d="n">Cancel</button></div>`;
    box.querySelector('[data-d="n"]').onclick=()=>box.innerHTML='';
    box.querySelector('[data-d="y"]').onclick=async()=>{ if(await gDelete(gid)){ GC.events=GC.events.filter(x=>x.gid!==gid); redraw(); toast('🗑️ Deleted from Google Calendar'); } }; });
}

    ${days.map(k=>{ const ev=eventsOn(k), tk=tasksOn(k);
      return `<div class="weekday"><div class="top"><h3 style="margin:0">${parseYmd(k).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}${k===ymd(new Date())?' · <span style="color:var(--A)">Today</span>':''}</h3><button class="qcopy" data-open="${k}">Open day →</button></div>
        ${ev.length?ev.map(eventRow).join(''):''}
        ${tk.length?`<div class="muted" style="font-size:14px;margin-top:4px">✅ ${tk.filter(t=>t.done).length}/${tk.length} tasks done: ${tk.map(t=>`${t.done?'<s>':''}${esc(t.text)}${t.done?'</s>':''}`).join(' · ')}</div>`:''}

    (await copyText(txt))?toast('✅ Agenda copied'):showCopyBox(txt); };
}
function drawSync(){
  const t=ymd(new Date()), unsynced=PLAN.events.filter(e=>e.date>=t&&!e.gsynced);
  const live=GC.state==='on';
  let gHtml;
  if(GC.state==='checking') gHtml='<p>⏳ Checking for your Google Calendar connection…</p>';
  else if(live&&GC.err==='approval_required') gHtml=`<p class="warnnote">🟡 Google Calendar is connected, but this page needs your OK to see your events.</p><div class="actions"><button class="btn" id="gAllow">✅ Allow Google Calendar</button></div>`;
  else if(live&&GC.err) gHtml=`<p class="warnnote">🟠 ${gMsg({code:GC.err})}</p><div class="actions"><button class="btn ghost" id="gRetry">🔄 Try again</button></div>`;
  else if(live) gHtml=`<p class="fb good" style="margin:0">🟢 <b>Live sync is on.</b> Your Google Calendar events appear in the planner (blue dots), and you can save, edit and delete events in Google right from here.${GC.storedAt?` <span class="muted" style="font-size:12px">Last updated ${new Date(GC.storedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.</span>`:''}</p>
      <label class="keep" style="margin-top:12px"><input type="checkbox" id="gAuto" ${GC.auto?'checked':''}> Automatically save new planner events to Google Calendar</label>
      <div class="actions"><button class="btn" id="gPushAll" ${unsynced.length?'':'disabled'}>☁️ Save ${unsynced.length} upcoming planner event${unsynced.length===1?'':'s'} to Google</button><button class="btn ghost" id="gRetry">🔄 Refresh from Google</button></div>`;

  const k=KEYS[clip%5], t0=c.currentTime+0.05, beat=0.5; // 120 BPM, 16 beats = 8s
  const chords=[[60,64,67],[59,62,67],[60,64,69],[60,65,69]], bass=[36,43,45,41];
  const mel=[76,79,77,76, 74,71,74,79, 76,72,76,81, 77,76,74,72];
  for(let bar=0;bar<4;bar++){
    const bt=t0+bar*4*beat, ch=chords[bar].map(n=>n+k);
    note(lg,'sine',mhz(bass[bar]+k),bt,0.45,0.32); note(lg,'sine',mhz(bass[bar]+k),bt+2*beat,0.45,0.28);
    for(let e=0;e<8;e++){ const tt=bt+e*beat/2; const n=ch[[0,1,2,1,0,1,2,1][e]]+(e%4===2?12:0);
      note(lg,'triangle',mhz(n),tt,0.28,e%2?0.07:0.1); if(e%2) hat(lg,tt,0.05); }
    for(let q=0;q<4;q++){ const n=mel[bar*4+q]+k; note(lg,'sine',mhz(n+12),bt+q*beat,0.6,0.09,0.002); note(lg,'sine',mhz(n+24),bt+q*beat,0.25,0.025,0.002); }
  }
  note(lg,'sine',mhz(84+k),t0,1.2,0.06,0.002); // opening sparkle
}

function enhGuessType(t){ t=t.toLowerCase();

  if(/\b(video|reel|tiktok|youtube|clip|shot|camera|animation|image|photo)\b/.test(t)) return 'video';
  if(/\b(email|e-mail|message|text|reply|letter|follow ?up)\b/.test(t)) return 'email';
  if(/\b(instagram|facebook|linkedin|post|caption|hashtag|social)\b/.test(t)) return 'social';
  if(/\b(cold call|prospect|lead|client|pitch|sell|sales|objection)\b/.test(t)) return 'sales';
  if(/\b(plan|strategy|marketing|budget|ads?|campaign|business|revenue|competitor)\b/.test(t)) return 'business';
  if(/\b(explain|learn|understand|teach|what is|how does)\b/.test(t)) return 'learn';

function enhLocal(text, type){

function enhAssemble(c){
