const CCX={
 'claude':{w:'Starts Claude Code, so you can chat with Claude about the files in the folder you’re in.',h:'Claude Code runs inside Command Prompt. It can read, create and change files in that folder, and it asks your permission before doing anything risky.',e:'You go into your Prompt CRAFT folder, type claude, then type “make the title bigger.” Claude finds the right file and makes the change.',t:'Always start it from inside your project folder. Claude only sees that folder (and any you add).'},
 'cd C:\\Users\\YourName\\my-project':{w:'Moves Command Prompt into a folder. “cd” means “change directory” (directory = folder).',h:'Command Prompt always works “inside” one folder. cd tells it which folder to move into. Replace the path with your real folder.',e:'Your project is in Documents\\prompt-craft. You type cd Documents\\prompt-craft, then claude — now Claude works on that project.',t:'Easy trick: type cd and a space, then drag the folder from File Explorer into the window — Windows types the path for you.'},
 'claude -c':{w:'Opens your most recent conversation again, right where you left off.',h:'Claude Code saves every conversation for each folder. -c (short for “continue”) loads the newest one for the folder you’re in.',e:'You were halfway through fixing your calendar, closed the window for dinner, and come back. claude -c brings back everything you were discussing.',t:'Use claude -r instead if you want an older conversation, not the latest one.'},
 'claude -r':{w:'Shows a list of your earlier conversations so you can pick one to continue.',h:'-r is short for “resume.” Use the arrow keys to choose a conversation and press Enter.',e:'Last week you worked on the Real Estate tab, and today on games. claude -r lets you jump back into last week’s chat.',t:'You can name sessions (/rename) so they’re easy to find in this list.'},
 'claude -p "your question"':{w:'Asks one question, prints the answer, and closes — no back-and-forth chat.',h:'-p means “print.” Claude answers once and exits, which is handy for quick questions and automatic scripts.',e:'claude -p "what does index.html do?" gives you a quick summary without opening a full session.',t:'Pair with --output-format json when another program needs to read the answer.'},
 'claude -p "query"':{alias:'claude -p "your question"'},
 'claude update':{w:'Downloads and installs the newest version of Claude Code.',h:'It checks Anthropic for a newer version and replaces yours. Your projects and conversations are not touched.',e:'A friend mentions a new command that you don’t have. Run claude update, restart Claude Code, and now you have it.',t:'Run it every week or two. Many problems disappear after an update.'},
 '/help':{w:'Shows every command available in your version of Claude Code.',h:'Claude Code lists its built-in commands plus any from plugins, skills or your own command files.',e:'You forgot the command to undo. Type /help and scroll — /rewind is right there.',t:'This is the most accurate list for your version — more than any cheat sheet.'},
 '/init':{w:'Creates a CLAUDE.md file — a “notes for Claude” page about your project.',h:'Claude looks through your project and writes down what it is, how it’s organized and how to run it. It reads that file at the start of every future session.',e:'Run /init once in Prompt CRAFT. From then on Claude already knows it’s one big HTML page and how you back it up to GitHub.',t:'Open CLAUDE.md afterwards and add your own rules, like “I’m a beginner — explain things simply.”'},
 '/clear':{w:'Wipes the current conversation and starts a fresh one.',h:'Claude forgets this chat (it’s still saved, so /resume can bring it back). Your files are not changed.',e:'You finished fixing the calculator and now want to work on games. /clear keeps the old calculator talk from confusing Claude.',t:'Starting fresh for each new task gives better, faster answers.'},
 '/compact':{w:'Shrinks a long conversation into a short summary so Claude has room to keep going.',h:'Claude has a limited memory for each chat. /compact replaces the full chat with a summary of the important parts.',e:'After two hours on one feature, Claude starts forgetting early details. /compact frees up room while keeping the key points.',t:'Add instructions to steer the summary: /compact keep the list of bugs we found.'},
 '/rewind':{w:'Goes back to an earlier point in the conversation — and can undo the file changes made since then.',h:'Claude Code keeps checkpoints as it works. /rewind shows a list; pick a point and choose to restore the chat, the code, or both.',e:'Claude redesigned your whole home page when you only wanted a color change. /rewind puts everything back the way it was.',t:'Pressing Esc twice is a quick way to get to the same thing.'},
 '/model':{w:'Switches which Claude AI model does the work.',h:'Bigger models think harder and handle complex jobs better; smaller ones are faster and use less of your plan.',e:'For a tricky bug, switch to the strongest model. For simple text changes, a faster model saves time.',t:'Pair with /effort to control how hard the model thinks.'},
 '/usage':{w:'Shows how much of your plan’s limit you’ve used and when it resets.',h:'Your plan allows a certain amount of use over a period of time. This shows where you are.',e:'You have a big job to do — check /usage first to make sure you won’t run out halfway.',t:'/cost and /stats show the same thing.'},
 '/memory':{w:'Opens your CLAUDE.md memory files so you can edit them.',h:'CLAUDE.md files hold instructions Claude reads every session. Editing them changes how Claude behaves from then on.',e:'Add “Always back up to GitHub after changes,” and Claude will remember to do it every time.',t:'There’s a personal one (all projects) and a project one (just this folder).'},
 '/status':{w:'Shows your Claude Code version, model, account and settings.',h:'A quick health check of how Claude Code is set up right now.',e:'Something seems off — /status confirms you’re signed in to the right account and using the model you expect.'},
 '/context':{w:'Shows how full Claude’s memory for this conversation is, and what is filling it.',h:'Everything — your messages, files Claude read, tool results — takes up space. This breaks it down.',e:'Claude feels slow and forgetful. /context shows it’s 90% full, so you run /compact.'},
 '/plan':{w:'Asks Claude to make a plan first, without changing any files yet.',h:'Claude explores and writes a step-by-step plan. Nothing changes until you approve it.',e:'Before adding a whole new tab, /plan shows you exactly what Claude will do, so you can say “yes” or “change step 3.”',t:'Shift + Tab also switches into plan mode.'},
 '/diff':{w:'Shows exactly what Claude changed in your files.',h:'It compares your files before and after, highlighting added and removed lines.',e:'Before backing up, check /diff to make sure Claude only changed what you asked.'},
 '/review':{w:'Has Claude check your code for bugs and problems.',h:'Claude reads your recent changes like a careful teacher marking homework and lists issues to fix.',e:'Before publishing a new feature, /review catches a button that was never connected.',t:'Add --fix to have Claude fix what it finds.'},
 '/permissions':{w:'Controls what Claude may do without asking you first.',h:'You can allow safe actions (like reading files) and block risky ones. Claude follows these rules every session.',e:'Tired of approving every file read? Allow reading, but keep “ask me” for deleting files.'},
 '/agents':{w:'Sets up subagents — helper assistants Claude can send off to do part of a job.',h:'You give each helper a name, a job and which tools it may use. Claude hands it work and gets back a short report.',e:'Make a “bug finder” helper. When you ask Claude to check your app, it sends the bug finder through every tab.'},
 '/mcp':{w:'Shows and manages connections to other apps and services (called MCP servers).',h:'Connections let Claude use tools outside your computer, like GitHub, calendars or design apps.',e:'You connect GitHub so Claude can back up your project and open pull requests itself.'},
 '/resume':{w:'Brings back an earlier conversation from inside Claude Code.',h:'Shows a list of past chats for this folder; pick one to continue.',e:'You remember a great idea from yesterday’s chat — /resume brings that chat back.'},
 '/export':{w:'Saves the whole conversation as a text file or copies it.',h:'Claude Code writes out every message so you can keep it or share it.',e:'Save a record of how you set up your calendar sync so you can repeat it later.'},
 '/doctor':{w:'Checks your Claude Code installation for problems and helps fix them.',h:'It tests your setup — version, sign-in, settings — and reports anything wrong.',e:'Claude Code won’t start properly after a Windows update. /doctor finds and explains the problem.'},
 '/exit':{w:'Closes Claude Code and returns you to normal Command Prompt.',h:'Your conversation is saved, so claude -c can bring it back.',e:'Done for the day? /exit, then close the window.'},
 'Esc':{w:'Stops Claude immediately, in the middle of whatever it’s doing.',h:'Claude halts its current step. Nothing more is changed, and you can type new instructions.',e:'You see Claude starting to edit the wrong file — press Esc right away, then explain what you meant.',t:'Changes already made stay — use /rewind to undo them.'},
 'Esc Esc':{w:'Press Esc twice to clear what you’re typing, or jump back to edit an earlier message.',h:'It opens a list of your earlier messages; choosing one lets you rewrite it and continue from there.',e:'Your request was unclear and Claude misunderstood. Esc Esc, fix the wording, and try again.'},
 'Shift + Tab':{w:'Switches between modes: normal, auto-accept edits, and plan mode.',h:'Normal asks before edits. Auto-accept lets Claude edit files without asking. Plan mode makes Claude plan first and change nothing.',e:'For a big change, switch to plan mode to see the plan first. For many small fixes you trust, use auto-accept.',t:'The current mode shows at the bottom of the screen.'},
 'Ctrl + C':{w:'Stops what’s happening or clears your typing. Press it twice to quit Claude Code.',h:'One press cancels; a second press in a row exits.',e:'You typed a long message by mistake — Ctrl + C clears it.'},
 'Ctrl + V':{w:'Pastes an image from your clipboard into your message.',h:'Take a screenshot (Windows key + Shift + S), then paste it. Claude can look at it.',e:'A button looks wrong — screenshot it, paste it, and ask “fix this button.”',t:'If Ctrl + V doesn’t paste images on Windows, try Alt + V.'},
 'Ctrl + R':{w:'Searches through messages you typed before.',h:'Start typing a word and it finds earlier messages that contain it.',e:'You asked for a detailed bug check last week — Ctrl + R, type “bug,” and reuse it.'},
 'Shift + Enter':{w:'Starts a new line without sending your message.',h:'Enter sends; Shift + Enter adds a line break so you can write longer, organized messages.',e:'Writing a list of 3 changes, each on its own line.',t:'If it doesn’t work, run /terminal-setup once, or use \\ then Enter.'},
 '@':{w:'Points Claude to a specific file.',h:'Type @ and a list of your files pops up. Pick one and Claude reads exactly that file.',e:'“Make the buttons in @index.html bigger” — Claude doesn’t have to guess which file.'},
 '!':{w:'Runs a regular Command Prompt command right inside Claude Code.',h:'Anything after ! runs directly on your computer, and Claude can see the result.',e:'! dir lists your files. ! git status shows what changed since your last backup.'},
 '/':{w:'Shows the list of commands as you type.',h:'Typing / at the start of your message opens a menu of commands you can pick from.',e:'Type / and start typing “com” to find /compact.'},
 '?':{w:'Shows the keyboard shortcuts.',h:'Typing ? on an empty line opens a quick shortcut list.',e:'You forgot the key for switching modes — type ? to check.'},
 'claude auth login':{w:'Signs you in to your Claude account from Command Prompt.',h:'It opens your browser so you can log in, then connects Claude Code to your account.',e:'First time using Claude Code on a new computer.'},
 'claude doctor':{w:'Checks your setup for problems (same as /doctor, but from Command Prompt).',h:'Runs a health check without starting a session.',e:'Claude Code won’t open at all — claude doctor tells you why.'},
 '--dangerously-skip-permissions':{w:'Lets Claude do anything without asking you first.',h:'All permission questions are skipped — including for deleting files and running commands.',e:'Only for a throwaway test folder where nothing can be lost.',t:'⚠️ Not recommended for beginners. One wrong step can’t be stopped before it happens.'},
 'CLAUDE.md':{w:'A notes file Claude reads at the start of every session in this project.',h:'Anything written there acts like standing instructions — rules, preferences, how to run things.',e:'Write “Explain every change in plain English” and Claude will always do that in this project.'},
 '.claude/commands/standup.md':{w:'Makes your own shortcut command.',h:'Create a folder called .claude/commands in your project and put a text file in it. The file name becomes the command; the file’s text is the instructions.',e:'A file named backup.md containing “Copy index.html to the repo, commit and push” becomes /backup.'},

const CC_HOW={slash:'You type it inside Claude Code (after starting it with “claude”). Commands start with a slash so Claude knows it’s an instruction to the app, not a message to answer.',plugin:'It comes from an add-on (a plugin). Once installed, it adds this command to Claude Code like a new tool in a toolbox.',terminal:'You type it in Command Prompt — not inside Claude Code. It controls Claude Code from the outside: starting it, updating it, or managing its settings.',flag:'A flag is an extra option you add after “claude” when you start it. It changes how that session behaves, only for that run.',key:'It’s a keyboard shortcut. You press it while Claude Code is open — no need to type a command.',prefix:'You type this symbol at the very start of your message. It tells Claude Code to treat what follows in a special way.',custom:'It’s a file you create yourself. Claude Code notices it and uses it automatically.'};
function ccFallback(kind,item,sec){
  const d=item[1].replace(/\s*\((Skill|Workflow|Admins)\)\s*$/,''); const skill=/\(Skill\)/.test(item[1]), wf=/\(Workflow\)/.test(item[1]);

  return {w:d+(skill?' It’s a “skill” — a packaged set of instructions Claude follows for this job.':wf?' It’s a “workflow” — a multi-step job Claude runs for you.':''),
    h:CC_HOW[kind],
    e:item[2]||({slash:`Inside a Claude Code session, you’d use it when you want to ${lc.replace(/\.$/,'')}.`,plugin:`After installing the plugin, use it when you want to ${lc.replace(/\.$/,'')}.`,terminal:`From Command Prompt, use it when you want to ${lc.replace(/\.$/,'')}.`,flag:`Add it when starting Claude Code if you want to ${lc.replace(/\.$/,'')}.`,key:`Press it whenever you want to ${lc.replace(/\.$/,'')}.`,prefix:`Use it whenever you want to ${lc.replace(/\.$/,'')}.`,custom:`Use it when you want to ${lc.replace(/\.$/,'')}.`})[kind]};
}
function ccArgsHTML(cmd){
  const req=[...cmd.matchAll(/<([^>]+)>/g)].map(m=>m[1]), opt=[...cmd.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);

  return `<div class="ccsec"><h4>🔧 Options</h4><ul class="steps">${req.map(a=>`<li><b>Required:</b> ${fmt(a)} — you must type this (without the &lt; &gt;).</li>`).join('')}${opt.map(a=>`<li><b>Optional:</b> ${fmt(a)} — add it or leave it out (without the [ ]).</li>`).join('')}</ul></div>`;
}

function ccDetail(host,sec,item,back){

      const lv={new:'a complete beginner with no computer training who uses Windows and Command Prompt. Use very simple words, no jargon, short sentences, and a friendly everyday example.',some:'someone with a little computer experience. Be clear and practical, define any technical word you use.',adv:'a confident user. Be precise and include useful options, gotchas and a pro tip.'}[LEVEL];
      const ask=`Explain this Claude Code command for ${lv}
Command: ${cmd}
Section: ${sec.n.replace(/^\S+\s/,'')}
Official short description: ${item[1]}
Base the explanation ONLY on that description and well-known Claude Code behavior; do not invent options or features. If unsure about details, stay general.
Return JSON: {"w":"what it does, 1-2 sentences","h":"how it works, 2-3 sentences","e":"one concrete example of when it helps, ideally about building a small website or making marketing videos","t":"one helpful tip or caution","p":"${LEVEL==='adv'?'one pro tip':''}"}`;
      try{ const r=await sample.json(ask,{cache:true}); if(!r||!r.w) throw 0; CCAI[aiKey]={w:String(r.w),h:String(r.h||''),e:String(r.e||''),t:String(r.t||''),p:String(r.p||'')}; try{ localStorage.setItem('pc_ccai',JSON.stringify(CCAI)); }catch(e){} if(host.isConnected) ccDetail(host,sec,item,back); }

    };

async function mfDownloadAll(items){

  const uniq=(folder,base,ext)=>{ let n=base, k=2; while(used[folder+'/'+n+'.'+ext]) n=base+' ('+(k++)+')'; used[folder+'/'+n+'.'+ext]=1; return folder+'/'+n+'.'+ext; };
  for(const x of items){ const t=MF_TYPES[x.type]||MF_TYPES.prompt, folder=t[1]+'s';
    if(MF_FILE(x)){ const b=await mfVideoBlob(x); if(!b){ skipped++; continue; } zip.file(uniq(folder,mfSafeName(x.title),x.type==='video'?mfVidExt(x,b.type):(mfExt(x)||'bin')), b); if(x.text&&x.text.trim()) zip.file(uniq(folder,mfSafeName(x.title)+' - notes','txt'), mfTxt(x)); }

async function cloudFlush(key){

  if(!CLOUD.pending[key]) return; CLOUD.pending[key]=false; CLOUD.writing[key]=true;

  catch(e){ if(e&&e.code==='unavailable'){ CLOUD.pending[key]=true; setTimeout(()=>cloudFlush(key),2000+Math.random()*2000); }

async function initCloud(){
  try{
    if(!(window.claude&&typeof window.claude.use==='function')){ cloudSetState('off'); return; }
    const [db,user]=await Promise.all([window.claude.use('db').catch(()=>null), window.claude.use('user').catch(()=>null)]);
    const uid=user&&typeof user.id==='function'?await user.id().catch(()=>null):null;
    if(!db||!uid){ cloudSetState('off'); return; }
    CLOUD.db=db; CLOUD.uid=uid;
    for(const key of Object.keys(CLOUD_KEYS)){
      let snap=null; try{ snap=await cloudDoc(key).get(); }catch(e){ if(['revoked','not_granted','capability_disabled','capability_removed'].includes(e&&e.code)){ CLOUD.db=null; cloudSetState('off'); return; } }
      const cd=snap&&snap.exists?snap.data():null, lts=Number(lsGet('pc_ts_'+key,'0'));
      if(cd&&cd.v!==undefined){
        if(key==='planner'&&!lts){ CLOUD.applying=true; CLOUD_KEYS.planner.set(mergePlanner(PLAN,cd.v)); CLOUD.applying=false; lsSet('pc_ts_planner',String(Date.now())); CLOUD.pending.planner=true; cloudFlush('planner'); }
        else if(key==='scores'){ CLOUD.applying=true; CLOUD_KEYS.scores.set(cd.v); CLOUD.applying=false; CLOUD.pending.scores=true; cloudFlush('scores'); }
        else if((cd.updatedAt||0)>lts){ CLOUD.applying=true; CLOUD_KEYS[key].set(cd.v); CLOUD.applying=false; lsSet('pc_ts_'+key,String(cd.updatedAt||Date.now())); }
        else if(lts>(cd.updatedAt||0)){ CLOUD.pending[key]=true; cloudFlush(key); }
      } else { lsSet('pc_ts_'+key, String(lts||Date.now())); CLOUD.pending[key]=true; cloudFlush(key); }
    }
    for(const key of Object.keys(CLOUD_KEYS)){
      CLOUD.unsubs.push(cloudDoc(key).onSnapshot(s=>{
        if(!s.exists||s.metadata.hasPendingWrites) return; const d=s.data(); if(!d||d.device===CLOUD.device) return;
        const lts=Number(lsGet('pc_ts_'+key,'0')); if((d.updatedAt||0)<=lts) return;
        CLOUD.applying=true; CLOUD_KEYS[key].set(d.v); CLOUD.applying=false; lsSet('pc_ts_'+key,String(d.updatedAt)); CLOUD.lastSync=Date.now();
        cloudRefreshView(key); toast('☁️ Updated from your other device');
      }, e=>{ if(e&&e.code==='revoked') cloudSetState('off'); }));
    }
    CLOUD.lastSync=Date.now(); if(CLOUD.state!=='saving') cloudSetState('on');
    if(window._rerender&&!document.querySelector('#app .bar')&&!document.querySelector('.modal')) try{ window._rerender(); }catch(e){}
  }catch(e){ cloudSetState('off'); }
}

  m.innerHTML=`<div class="card pop helpcard"><div class="top"><h2 style="margin:0">☁️ Cloud saving</h2><button class="xbtn" id="ccX">✕ Close</button></div>
    ${on?`<p class="fb good" style="margin-top:10px">✅ <b>Your data is saved to your Claude account</b> and syncs automatically to every device where you open this app in Claude.${CLOUD.lastSync?` <span class="muted" style="font-size:12px">Last synced ${new Date(CLOUD.lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.</span>`:''}</p>`
       :CLOUD.state==='error'?`<p class="warnnote" style="margin-top:10px">⚠️ Cloud saving hit a problem, so changes are being kept on this device for now. They’ll sync when you reload the page.</p>`
       :`<p class="warnnote" style="margin-top:10px">💻 <b>Saving on this device only.</b> Cloud saving works when you open the app inside <b>claude.ai</b> (or the Claude app) while signed in. On other copies — like the GitHub website — your data stays in this browser.</p>`}
    <h3>What’s saved</h3>
    <ul class="steps"><li>📅 Planner events and to-do lists</li><li>✨ Your recent enhanced prompts</li><li>👤 My Info (name, phone, address…)</li><li>🧾 Running receipt</li><li>🎓 Skill level, 🎵 music & 🗣️ voice settings, Google sync setting</li><li>🏆 Your best game scores</li></ul>
    <h3>Privacy</h3><p style="font-size:14px">Your cloud data is private to <b>your</b> account — even if you share this app with someone, they can’t see your planner or info, and you can’t see theirs. Photos and videos you add in the Studio or Video Detective are <b>never</b> uploaded.</p>
    ${on?`<div class="actions"><button class="btn" id="ccSync">🔄 Sync now</button></div>`:''}</div>`;
  document.body.appendChild(m); const close=()=>m.remove();
  m.querySelector('#ccX').onclick=close; m.onclick=e=>{ if(e.target===m) close(); };
  if(m.querySelector('#ccSync')) m.querySelector('#ccSync').onclick=()=>{ Object.keys(CLOUD_KEYS).forEach(k=>{ CLOUD.pending[k]=true; cloudFlush(k); }); toast('🔄 Syncing…'); close(); };
}

/* wrap savers so every change also saves to the cloud */
const _savePF0=savePF, _savePlan0=savePlan, _saveRcpt0=saveRcpt, _saveBest0=saveBest, _setLevel0=setLevel;
savePF=function(){ _savePF0(); cloudMark('profile'); };
savePlan=function(){ _savePlan0(); cloudMark('planner'); };
saveRcpt=function(){ _saveRcpt0(); cloudMark('receipt'); };
saveBest=function(g,pct){ const b=store('best_'+g)||0; _saveBest0(g,pct); if(pct>b) cloudMark('scores'); };
setLevel=function(l){ _setLevel0(l); if(!CLOUD.applying) cloudMark('prefs'); };
document.getElementById('lvlTop').innerHTML=levelSwitch(); updateMeBtn(); drawCloudBadge(); initCloud();
updateFilesBtn();
if(location.hash==='#claudecode'){ home(); openClaudeCode(); } else if(location.hash==='#files') myFilesView(); else if(location.hash==='#enhancer') enhancerView(); else if(location.hash==='#detective') videoDetectiveView(); else if(location.hash==='#tools') toolsView(); else if(location.hash==='#planner') plannerView(); else if(location.hash==='#studio'||location.hash==='#realestate') studioView(); else if(location.hash==='#library') libraryView(); else if(location.hash==='#games') gamesView(); else home();
</script>
